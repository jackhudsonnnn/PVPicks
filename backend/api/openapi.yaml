      responses:
        '200':
          description: The modes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModeAvailability'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /gifs:
    get:
      operationId: listGifs
      summary: The chat GIF library
      description: >-
        The curated library the GIF picker shows; sending a GIF accepts only
        these ids. Cacheable for an hour.
      responses:
        '200':
          description: Categories and GIFs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GifCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/chat/latest:
    get:
      operationId: listLatestChatMessages
      summary: The latest visible chat message at each of your current tables
      description: >-
        For the table cards on Home. One entry per current (not archived)
        table you belong to, in table id order. Visibility matches the chat
        window: deleted authors' and blocked authors' text and GIF messages
        are skipped, so the preview is the newest message you would see in
        that table's chat. Only text and system messages carry `text`
        (system text names host-event subjects as in the window); for GIF,
        bet and settlement messages the client describes the kind. Refetch
        when a table's chat feed reports a change.
      responses:
        '200':
          description: The previews.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /invites/{inviteId}/respond:
    parameters:
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: respondToInvite
      summary: Accept or decline the current user's invitation
      description: >-
        The sender must still be a host, the recipient must follow the sender,
        and the current friends or following preference must not be closed.
        Ineligible requests are permanently cancelled; once cancelled they
        cannot be declined. A request older than 30 days has expired and
        returns 409 like a cancelled one. Acceptance adds a member and a
        system chat message atomically; it returns 409 `table_limit` when the
        caller is at 100 tables and `table_full` when the table has 500
        members, and the request stays waiting. A matching retry returns 204
        only while current visibility and authorization still permit it.
        Requests are created by POST /tables/{tableId}/members, and the
        recipient's personal feed announces changes (`invitations.changed`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accept]
              properties:
                accept:
                  type: boolean
      responses:
        '204':
          description: Response recorded.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /reports:
    post:
      operationId: submitReport
      summary: Submit a report for the moderation queue
      description: >-
        Dev implementation. The target must be another player. tableId must be
        a non-archived table the caller is a member of; messageId requires
        tableId and must be a text or GIF message the target wrote there (its
        content is kept with the report). At most 20 reports per caller per
        rolling day (429). Reports are stored for a future moderation queue.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetId, reason, note]
              properties:
                targetId:
                  type: string
                  format: uuid
                reason:
                  type: string
                  enum: [harassment, settlement, spam, offensive, other]
                note:
                  type: string
                  maxLength: 500
                  description: Required and nonblank for reason other.
                tableId:
                  type: string
                  format: uuid
                messageId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Report submitted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /feedback:
    post:
      operationId: submitFeedback
      summary: Submit guide feedback
      description: >-
        Stores feedback for the authenticated user. Text and an optional link
        are trimmed using JavaScript whitespace rules. NUL and unpaired
        surrogates are rejected because PostgreSQL cannot store them safely.
        The dev endpoint does not implement rate limiting or moderation reads.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackSubmission'
      responses:
        '201':
          description: Feedback submitted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /users/{userId}/history:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getUserBetHistory
      summary: Read a user's visible bet history
      description: Only return bets that the caller is authorized to see.
      parameters:
        - $ref: '#/components/parameters/OptionalTableId'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of bet history.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bet'
                  nextCursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{userId}/settlements:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getUserSettlementHistory
      summary: Read authorized settlement receipts for a user
      description: >-
        Dev implementation.
        Return only receipts the caller is authorized to see, including
        completed and archived-table history. Optionally filter by table.
        An unrelated or unknown user yields an empty list.
      parameters:
        - $ref: '#/components/parameters/OptionalTableId'
      responses:
        '200':
          description: Settlement receipts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SettlementLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tables/{tableId}/last-read:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      operationId: getChatUnreadState
      summary: Read the current member's unread chat state
      description: >-
        Count only visible messages after the caller's read position, excluding
        their own messages. A member who has never opened the chat starts with
        all visible messages except their own unread, including system messages.
        Dev supports current members of non-archived tables only. Text and GIF
        messages from deleted authors or authors blocked by the caller are
        excluded; bet, system and settlement messages remain visible.
      responses:
        '200':
          description: The caller's filtered unread state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatUnreadState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: advanceChatReadPosition
      summary: Advance the current member's last-read chat position
      description: >-
        The requested message must be visible to the caller in this table.
        The position only moves forward, never backwards. It remains meaningful
        if a previously read message is later deleted. Matching retries recheck
        current access and target visibility, then return 204 without reapplying.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [messageId]
              properties:
                messageId:
                  type: string
                  format: uuid
      responses:
        '204':
          description: Position advanced or already beyond the requested message.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /ticker:
    get:
      operationId: getTicker
      summary: Get the sports-only ticker snapshot
      description: >-
        Dev implementation. Return games scheduled on the current America/New_York calendar date
        plus any live games scheduled on an earlier date. Include each game
        once, with live games first, then scheduled start and game ID ascending.
        No bet, participant, table or financial data is included. Clients
        perform presentation looping locally. An empty games array means no
        games in scope, not a substitute for unavailable feed data: unless every
        league was polled successfully within the freshness window (dev
        default three minutes) the response is 503 with code feed_unavailable.
      responses:
        '200':
          description: Sports ticker snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickerSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /games/{gameId}/players:
    get:
      operationId: listGamePlayers
      summary: A game's pickable players with current stats, for the player modes
      description: >-
        Both teams' active players plus anyone seen in the game's stats, by
        team then name, with each player's current canonical stats; and the
        league's stats in the order the proposal sheet offers them.
      parameters:
        - name: gameId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Players and stats.
          content:
            application/json:
              schema:
                type: object
                required: [stats, players]
                properties:
                  stats:
                    type: array
                    items:
                      type: object
                      required: [key, label]
                      properties:
                        key: {type: string}
                        label: {type: string}
                  players:
                    type: array
                    items:
                      type: object
                      required: [id, name, team, played, stats]
                      properties:
                        id: {type: string}
                        name: {type: string}
                        position: {type: [string, 'null']}
                        team: {type: [string, 'null']}
                        played: {type: boolean}
                        stats:
                          type: object
                          additionalProperties: {type: integer}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /games:
    get:
      operationId: listGames
      summary: Get the sports schedule and current snapshots
      parameters:
        - name: date
          in: query
          required: true
          description: >-
            Calendar date of the scheduled start in America/New_York,
            including daylight-saving transitions.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Available games on the requested date.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /users:
    get:
      operationId: searchUsers
      summary: Find visible users by username
      description: >-
        Dev search trims ECMAScript whitespace, lowercases, and matches a literal
        username substring. It excludes the caller, deleted users and blocks
        in either direction; frozen users remain visible without their status.
        Pages contain at most 50 users in username order. Cursors represent a
        position rather than a snapshot, so renames or visibility changes may
        alter subsequent pages. Rate limiting is not yet implemented.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            description: After trimming and lowercasing, 1–15 ASCII letters, digits or underscores.
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of visible users.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  nextCursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getVisibleUser
      summary: Get a visible user or deleted-user placeholder
      description: >-
        Dev lookup includes the caller and frozen users without revealing status.
        A caller can resolve someone they blocked, even if the block is mutual.
        An incoming-only block hides the identity unless both users are current
        members of the same active table or are parties to the same receipt.
        Deleted identities return a placeholder only for shared current
        membership, an unexpired shared archive, a direct receipt, or an identity
        referenced by visible historical chat in an accessible table or archive.
        Other deleted, blocked and nonexistent identities return the same 404.
        Receipt history and account deletion are not yet implemented.
      responses:
        '200':
          description: The authorized public identity.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/User'
                  - $ref: '#/components/schemas/DeletedUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/delete:
    post:
      operationId: deleteMyAccount
      summary: Delete your own account
      description: >-
        Requires your password. Blocked (409 account_not_square, with
        `blockers`) while you're in an Active or Pending bet, have unsettled
        table points, or have open receipts. Deletion removes personal data
        (profile, relationships, invite preferences, chat text and GIFs,
        reactions, read positions, feedback, debt cap, memberships and
        invitations, tomatoes) and turns the account into "Deleted user", which
        bets, the ledger and receipts keep referencing. Moderation records are
        kept. Tables you hosted pass to their earliest-joined active member, or
        are archived if nobody active is left. Ends every session and clears the
        session cookie. Not idempotency-keyed: after success a retry can only
        fail authentication.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: {type: string}
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The password doesn't match (code `wrong_password`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Not square yet (code `account_not_square`).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, message, blockers]
                properties:
                  code: {type: string, const: account_not_square}
                  message: {type: string}
                  blockers:
                    type: array
                    items:
                      type: string
                      enum: [open_bets, unsettled_points, open_receipts]
  /admin/reports:
    get:
      operationId: listReports
      summary: The moderation queue
      description: >-
        Admin only. Reports newest first (at most 200), open ones unless
        status=all, with both people's current status and strikes and the
        reported message as it was when reported.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, all]
            default: open
      responses:
        '200':
          description: Reports.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModerationReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/reports/{reportId}/dismiss:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: dismissReport
      summary: Dismiss an open report
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Dismissed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already handled (code `already_handled`) or a reused key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/reports/{reportId}/strike:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: strikeReport
      summary: Resolve a report with a strike against the reported player
      description: >-
        Strikes stop at three. Reaching three (again, after an unfreeze)
        freezes the account: its sessions end, sign-in reports it frozen, and
        tables it hosted pass to their earliest-joined active member (or are
        archived if nobody active is left). A replayed key returns 204.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The player's strikes now, and whether this strike froze them.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [strikes, frozen]
                properties:
                  strikes: {type: integer, minimum: 1, maximum: 3}
                  frozen: {type: boolean}
        '204':
          description: Replayed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already handled (code `already_handled`) or a reused key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users/flagged:
    get:
      operationId: listFlaggedUsers
      summary: Players with strikes or a frozen account
      responses:
        '200':
          description: People, frozen first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModerationPerson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/players:
    get:
      operationId: listPlayers
      summary: Player accounts, newest first
      description: >-
        Whether each has set a password, and when their live setup or reset
        code expires (codes themselves are never shown again).
      responses:
        '200':
          description: Players.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, username, status, passwordSet, codeExpiresAt, createdAt]
                  properties:
                    id:
                      type: string
                      format: uuid
                    username:
                      type: string
                    status:
                      type: string
                      enum: [ACTIVE, FROZEN]
                    passwordSet:
                      type: boolean
                    codeExpiresAt:
                      type: [string, 'null']
                      format: date-time
                    createdAt:
                      type: string
                      format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createPlayer
      summary: Create a player account and its setup code
      description: >-
        There's no registration: the admin creates each account. The
        username is trimmed and lowercased. The response carries the
        single-use setup code once (valid 24 hours); issue another with
        /admin/players/{playerId}/code if it's lost. No retry key: a
        retry finds the username taken.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username]
              properties:
                username:
                  type: string
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SetupCode'
                  - type: object
                    required: [id, username]
                    properties:
                      id:
                        type: string
                        format: uuid
                      username:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The username is taken (code `username_taken`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/players/{playerId}/code:
    parameters:
      - name: playerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: issuePlayerCode
      summary: Issue a new setup or reset code
      description: >-
        SETUP while the player has never set a password, RESET after.
        Cancels their unused code. Redeeming a reset code ends all their
        sessions.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupCode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/users/{userId}/unfreeze:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: unfreezeUser
      summary: Let a frozen player sign in again
      description: Restores sign-in only; strikes and hosting are unchanged.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Unfrozen.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not frozen (code `already_handled`) or a reused key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users/{userId}/clear-strikes:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: clearStrikes
      summary: Reset a player's strikes to zero
      description: Doesn't unfreeze a frozen account.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /dev/sports:
    get:
      operationId: listDevSports
      summary: Dev sports data sources (dev profile only)
      description: >-
        Registered only when PVPICKS_DEV_SPORTS_DIR is set; 404 otherwise.
        Lists scenario files and recorded chunks with what's running. Running
        sources feed DEV- games through the real game and stats sync. See
        docs/site/dev-sports-data.md.
      responses:
        '200':
          description: Sources.
          content:
            application/json:
              schema:
                type: object
                required: [speeds, scenarios, chunks]
                properties:
                  speeds:
                    type: array
                    items: {type: number}
                  scenarios:
                    type: array
                    items:
                      $ref: '#/components/schemas/DevSource'
                  chunks:
                    type: array
                    items:
                      $ref: '#/components/schemas/DevSource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /dev/sports/{kind}/{name}/{action}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: {type: string, enum: [scenarios, chunks]}
      - name: name
        in: path
        required: true
        schema: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,40}$'}
      - name: action
        in: path
        required: true
        schema: {type: string, enum: [start, stop, pause, resume, speed]}
    post:
      operationId: controlDevSource
      summary: Start (or restart), stop, pause, resume, or set a chunk's speed
      description: >-
        Dev profile only. pause, resume and speed apply to chunks; speed takes
        {"speed": n} with n one of the listed speeds.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                speed: {type: number}
      responses:
        '204':
          description: Done.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /dev/demo:
    get:
      operationId: getDemoWorld
      summary: The demo world's size (dev demo only)
      description: >-
        Registered only when the dev demo is on (the dev profile); 404
        otherwise. The Dev page shows its Reset section when this answers. See
        docs/site/demo-data.md.
      responses:
        '200':
          description: Counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoWorld'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /dev/demo/reset:
    post:
      operationId: resetDemoWorld
      summary: Wipe app data and reseed the demo world (dev demo only)
      description: >-
        Wipes every app table except sports data (games, players, stats, feed
        status) and the migration history, then reseeds the demo world. Every
        session ends, the caller's included: the response clears the session
        cookie and rotates the CSRF token.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: The reseeded world's counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoWorld'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /dev/demo/accounts:
    get:
      operationId: listDemoAccounts
      summary: Accounts for the demo's sign-in picker (dev demo only)
      description: >-
        No authentication. The main accounts (newbie, intermediate, pro,
        admin) in that order, then up to 20 other accounts whose username
        starts with q.
      security: []
      parameters:
        - name: q
          in: query
          required: false
          schema: {type: string, pattern: '^[A-Za-z0-9_]{0,15}$'}
      responses:
        '200':
          description: Accounts.
          content:
            application/json:
              schema:
                type: object
                required: [main, others]
                properties:
                  main:
                    type: array
                    items:
                      $ref: '#/components/schemas/DemoAccount'
                  others:
                    type: array
                    items:
                      $ref: '#/components/schemas/DemoAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /dev/demo/sign-in:
    post:
      operationId: signInToDemoAccount
      summary: Sign in as any account without a password (dev demo only)
      description: >-
        Same session cookie and CSRF rotation as /auth/login, replacing the
        caller's session. Frozen accounts get 403 account_frozen.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: {type: string, format: uuid}
      responses:
        '204':
          description: Signed in.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/health:
    get:
      operationId: getAdminHealth
      summary: Get the dev admin dependency health snapshot
      description: >-
        Active administrators only. Reports PostgreSQL and Redis indicator
        statuses without connection details. Kafka is explicitly NOT_CHECKED;
        this is not an overall application status or a latency/error metrics
        feed. A failed dependency can be reported in a successful snapshot.
        Authentication and admin authorization require PostgreSQL, so this
        endpoint may be unavailable when PostgreSQL is down.
      responses:
        '200':
          description: A non-cacheable dependency snapshot.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHealthSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Health snapshot could not be collected.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: >-
        Dev JWT in the host-only HttpOnly session cookie, with Path=/ and
        SameSite=Strict. Local HTTP cannot use Secure; LAN and production
        require TLS and Secure cookies and remain unavailable. Dev sessions
        expire after eight hours without refresh. Each authenticated request
        checks the JWT and its server-side session and account status.
        Logout revokes the current session immediately; frozen or deleted
        accounts and revoked or expired sessions cannot authenticate. Session
        state is authoritative in PostgreSQL, not Redis.
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Token returned by GET /auth/csrf for the current CSRF cookie.
      schema:
        type: string
        minLength: 1
    TableId:
      name: tableId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BetId:
      name: betId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OptionalTableId:
      name: tableId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor from the preceding response.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        A client-generated key reused only to retry the same operation. The
        draft guarantee is 24 hours after commit, scoped to the authenticated
        user across operations. A different operation, target or payload with
        the same key returns 409. Concurrent matching requests must not apply
        the effect twice. Authentication, current authorization and visibility
        are rechecked before a recorded outcome is returned; after the window,
        reconcile state rather than retrying blindly. The dev invite preferences PUT, debt-cap PUT,
        feedback POST, invitation response POST and follow/block POST/DELETE
        implement this protection,
        with bodyless 201 or 204 outcomes and no pruning. Other operations
        remain drafts.
        Retention, key rotation and replay of other response shapes need review.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  schemas:
    SetupCode:
      type: object
      required: [setupCode, purpose, expiresAt]
      properties:
        setupCode:
          type: string
          description: Shown once; the player opens /setup#<setupCode>.
        purpose:
          type: string
          enum: [SETUP, RESET]
        expiresAt:
          type: string
          format: date-time
    AdminHealthSnapshot:
      type: object
      additionalProperties: false
      required: [checkedAt, postgres, redis, kafka]
      properties:
        checkedAt:
          type: string
          format: date-time
        postgres:
          $ref: '#/components/schemas/DependencyCheckStatus'
        redis:
          $ref: '#/components/schemas/DependencyCheckStatus'
        kafka:
          const: NOT_CHECKED
    DependencyCheckStatus:
      type: string
      enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
    FeedbackSubmission:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [mode, perk, gif, bug, other]
        text:
          type: string
          description: Trim surrounding whitespace, then require 10 to 1000 UTF-16 code units.
        link:
          type: string
          pattern: '^(\s*|\s*[hH][tT][tT][pP][sS]?://\S+\s*)$'
          description: >-
            Trim surrounding whitespace; an empty result means no link.
            Otherwise require an HTTP(S) link with no whitespace.
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
    TickerSnapshot:
      type: object
      additionalProperties: false
      required: [games]
      properties:
        games:
          type: array
          description: Unique games in ticker order.
          items:
            $ref: '#/components/schemas/TickerGame'
    TickerGame:
      type: object
      additionalProperties: false
      required: [id, league, status, startsAt, home, away, observedAt, dev]
      properties:
        dev:
          type: boolean
          description: >-
            A dev data game (a dev scenario or recorded chunk, dev profile
            only), not a real one. Dev games show even when the real feed is
            stale.
        id:
          type: string
          minLength: 1
        league:
          type: string
          enum: [NBA, NFL]
        status:
          type: string
          enum: [SCHEDULED, LIVE, FINAL, POSTPONED]
        startsAt:
          type: string
          format: date-time
        period:
          type: [integer, 'null']
          minimum: 1
        clock:
          type: [string, 'null']
        home:
          $ref: '#/components/schemas/TickerTeam'
        away:
          $ref: '#/components/schemas/TickerTeam'
        observedAt:
          type: string
          format: date-time
    TickerTeam:
      type: object
      additionalProperties: false
      required: [abbreviation, score]
      properties:
        abbreviation:
          type: string
          minLength: 1
        score:
          type: [integer, 'null']
          minimum: 0
    Game:
      type: object
      additionalProperties: false
      required: [id, league, status, startsAt, home, away, observedAt]
      properties:
        id:
          type: string
        league:
          type: string
          enum: [NBA, NFL]
        status:
          type: string
          enum: [SCHEDULED, LIVE, FINAL, POSTPONED]
        startsAt:
          type: string
          format: date-time
        period:
          type: [integer, 'null']
        clock:
          type: [string, 'null']
        home:
          $ref: '#/components/schemas/GameTeam'
        away:
          $ref: '#/components/schemas/GameTeam'
        observedAt:
          type: string
          format: date-time
    GameTeam:
      type: object
      additionalProperties: false
      required: [abbreviation, name, city, score, players]
      properties:
        abbreviation:
          type: string
        name:
          type: string
        city:
          type: string
        score:
          type: [integer, 'null']
        players:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, position]
            properties:
              id:
                type: string
              name:
                type: string
              position:
                type: string
    UuidList:
      type: array
      uniqueItems: true
      items:
        type: string
        format: uuid
    Relationships:
      type: object
      additionalProperties: false
      required: [followingIds, followerIds, friendIds, blockedIds]
      description: Every list is newest first.
      properties:
        followingIds:
          $ref: '#/components/schemas/UuidList'
        followerIds:
          $ref: '#/components/schemas/UuidList'
        friendIds:
          $ref: '#/components/schemas/UuidList'
          description: Mutual follows, newest friendship first (when the second follow happened).
        blockedIds:
          $ref: '#/components/schemas/UuidList'
    InvitePreferences:
      type: object
      additionalProperties: false
      required: [friends, following]
      properties:
        friends:
          type: string
          enum: [open, request, closed]
        following:
          type: string
          enum: [open, request, closed]
    TableInvite:
      type: object
      additionalProperties: false
      required: [id, tableId, tableName, tableEmoji, fromId, userId, createdAt, memberPreview, memberCount]
      properties:
        id:
          type: string
          format: uuid
        tableId:
          type: string
          format: uuid
        tableName:
          type: string
        tableEmoji:
          type: string
        fromId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        memberPreview:
          type: array
          maxItems: 4
          description: >-
            Up to four of the table's members in join order, for avatars on
            the request card. Leaves out deleted accounts and members who
            block the invitee, so every listed profile is readable.
          items:
            type: string
            format: uuid
        memberCount:
          type: integer
          minimum: 1
          maximum: 500
          description: Everyone at the table, including members the preview leaves out.
    Settlement:
      type: object
      additionalProperties: false
      required: [id, tableId, hostId, createdAt, lines]
      properties:
        id:
          type: string
          format: uuid
        tableId:
          type: string
          format: uuid
        hostId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SettlementLine'
    SettlementLine:
      type: object
      additionalProperties: false
      required: [id, settlementId, tableId, payerId, payeeId, amountCents, status, revision, settleId, createdAt, updatedAt]
      description: >-
        A receipt: one table's points settlement between two people. Unpaid
        until a settle closes it.
      properties:
        id:
          type: string
          format: uuid
        settlementId:
          type: string
          format: uuid
        tableId:
          type: string
          format: uuid
        payerId:
          type: string
          format: uuid
        payeeId:
          type: string
          format: uuid
        amountCents:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [unpaid, paid, forgiven]
        revision:
          type: integer
          minimum: 0
        settleId:
          type: [string, 'null']
          format: uuid
          description: The settle that closed it; null while unpaid.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Settle:
      type: object
      additionalProperties: false
      required: [id, kind, senderId, otherId, payerId, payeeId, amountCents, createdAt, rejectBy, rejectedAt, canReject, lines]
      description: One action that closed a set of a pair's receipts.
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [sent, received, forgiven]
        senderId:
          type: string
          format: uuid
          description: Who settled.
        otherId:
          type: string
          format: uuid
        payerId:
          type: [string, 'null']
          format: uuid
          description: Who pays the selection's net; null when it netted to zero.
        payeeId:
          type: [string, 'null']
          format: uuid
        amountCents:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        rejectBy:
          type: [string, 'null']
          format: date-time
          description: Sent settles only; the receiver can reject until then.
        rejectedAt:
          type: [string, 'null']
          format: date-time
        canReject:
          type: boolean
          description: Whether the caller can reject it now.
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, tableId, payerId, payeeId, amountCents, createdAt]
            properties:
              id:
                type: string
                format: uuid
              tableId:
                type: string
                format: uuid
              payerId:
                type: string
                format: uuid
              payeeId:
                type: string
                format: uuid
              amountCents:
                type: integer
                minimum: 1
              createdAt:
                type: string
                format: date-time
    BetPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Bet'
        nextCursor:
          type: [string, 'null']
    TomatoThrow:
      type: object
      additionalProperties: false
      required: [id, throwerId, targetId, thrownAt]
      properties:
        id:
          type: string
          format: uuid
        throwerId:
          type: string
          format: uuid
        targetId:
          type: string
          format: uuid
        thrownAt:
          type: string
          format: date-time
    TableBalance:
      type: object
      additionalProperties: false
      required: [userId, settleCents, trueCents]
      properties:
        userId:
          type: string
          format: uuid
        settleCents:
          type: integer
          format: int64
        trueCents:
          type: integer
          format: int64
    SettlementGroup:
      type: object
      additionalProperties: false
      required: [otherUserId, netCents, lines, pendingReviewRevision, pendingSettles]
      properties:
        otherUserId:
          type: string
          format: uuid
        netCents:
          type: integer
          format: int64
          description: Of the open receipts. Positive means the caller is owed points; negative means the caller owes.
        pendingReviewRevision:
          type: [string, 'null']
          format: uuid
          description: The caller's unreviewed balance-change warning; settling waits until it's reviewed.
        lines:
          type: array
          description: The open receipts.
          items:
            $ref: '#/components/schemas/SettlementLine'
        pendingSettles:
          type: array
          description: Sent settles between the two still inside their reject window, newest first.
          items:
            $ref: '#/components/schemas/Settle'
    PendingSettlementReview:
      type: object
      additionalProperties: false
      required: [otherUserId, pendingReviewRevision]
      properties:
        otherUserId:
          type: string
          format: uuid
        pendingReviewRevision:
          type: string
          format: uuid
          description: The caller's current unreviewed warning for this person.
    SettlementReview:
      type: object
      additionalProperties: false
      required: [pendingReviewRevision]
      properties:
        pendingReviewRevision:
          type: [string, 'null']
          format: uuid
          description: The caller's current unreviewed warning, or null.
    ChatUnreadState:
      type: object
      additionalProperties: false
      required: [firstUnreadMessageId, unreadCount]
      properties:
        firstUnreadMessageId:
          type: [string, 'null']
          format: uuid
        unreadCount:
          type: integer
          minimum: 0
      allOf:
        - if:
            properties:
              unreadCount:
                const: 0
            required: [unreadCount]
          then:
            properties:
              firstUnreadMessageId:
                type: 'null'
          else:
            properties:
              firstUnreadMessageId:
                type: string
                format: uuid
    ChatPreview:
      type: object
      additionalProperties: false
      required: [tableId, message]
      properties:
        tableId:
          type: string
          format: uuid
        message:
          description: The newest visible message, or null when the table has none.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ChatPreviewMessage'
    ChatPreviewMessage:
      type: object
      additionalProperties: false
      required: [id, kind, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [text, gif, bet, system, settlement, poll]
        createdAt:
          type: string
          format: date-time
        authorId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
    MemberRecord:
      type: object
      additionalProperties: false
      required: [played, won, lost, netCents]
      properties:
        played: {type: integer, minimum: 0}
        won: {type: integer, minimum: 0}
        lost: {type: integer, minimum: 0}
        netCents: {type: integer}
    ModeAvailability:
      type: object
      additionalProperties: false
      required: [id, available]
      properties:
        id:
          $ref: '#/components/schemas/BetMode'
        available:
          type: boolean
    GifCatalog:
      type: object
      additionalProperties: false
      required: [categories, gifs]
      properties:
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, label]
            properties:
              id: {type: string, minLength: 1}
              label: {type: string, minLength: 1}
        gifs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, url, alt, category, tags]
            properties:
              id: {type: string, minLength: 1}
              url: {type: string, format: uri}
              alt: {type: string, minLength: 1}
              category: {type: string, minLength: 1}
              tags:
                type: array
                items: {type: string}
    ChatMessage:
      type: object
      additionalProperties: false
      required: [id, tableId, kind, createdAt]
      properties:
        bet:
          type: object
          additionalProperties: false
          required: [question, modeId, status]
          description: For bet messages, what the card shows without loading the bet.
          properties:
            question: {type: string}
            modeId: {type: string}
            status:
              type: string
              enum: [ACTIVE, PENDING, SETTLED, WASHED]
        id:
          type: string
          format: uuid
        tableId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [text, gif, bet, system, settlement, poll]
        createdAt:
          type: string
          format: date-time
        authorId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
        gifId:
          type: string
          minLength: 1
        betId:
          type: string
          format: uuid
        settlementId:
          type: string
          format: uuid
        settlementSummary:
          $ref: '#/components/schemas/ChatSettlementSummary'
        poll:
          $ref: '#/components/schemas/ChatPoll'
        reactions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [userId, emoji]
            properties:
              userId:
                type: string
                format: uuid
              emoji:
                type: string
      oneOf:
        - required: [authorId, text]
          properties:
            kind: { const: text }
            authorId: true
            text: true
            gifId: false
            betId: false
            settlementId: false
            settlementSummary: false
            poll: false
        - required: [authorId, gifId]
          properties:
            kind: { const: gif }
            authorId: true
            gifId: true
            text: false
            betId: false
            settlementId: false
            settlementSummary: false
            poll: false
        - required: [authorId, betId]
          properties:
            kind: { const: bet }
            authorId: true
            betId: true
            text: false
            gifId: false
            settlementId: false
            settlementSummary: false
            poll: false
        - required: [text]
          properties:
            kind: { const: system }
            text: true
            authorId: false
            gifId: false
            betId: false
            settlementId: false
            settlementSummary: false
            poll: false
        - required: [settlementId, settlementSummary]
          properties:
            kind: { const: settlement }
            settlementId: true
            settlementSummary: true
            authorId: false
            text: false
            gifId: false
            betId: false
            poll: false
        - required: [authorId, text, poll]
          description: A poll; its question is the text.
          properties:
            kind: { const: poll }
            authorId: true
            text: true
            poll: true
            gifId: false
            betId: false
            settlementId: false
            settlementSummary: false
    ChatPoll:
      type: object
      additionalProperties: false
      required: [options, votes]
      description: >-
        A poll's options and every vote from a non-deleted member, oldest
        first. Votes are visible to everyone at the table; polls never close.
      properties:
        options:
          type: array
          minItems: 2
          maxItems: 6
          items:
            type: string
            minLength: 1
        votes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [userId, option]
            properties:
              userId:
                type: string
                format: uuid
              option:
                type: integer
                minimum: 0
                maximum: 5
                description: Index into options.
    ChatSettlementSummary:
      type: object
      additionalProperties: false
      description: >-
        Static amounts and parties from the original settlement, not current
        receipt statuses or live balances.
      required: [hostId, lines]
      properties:
        hostId:
          type: string
          format: uuid
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [payerId, payeeId, amountCents]
            properties:
              payerId:
                type: string
                format: uuid
              payeeId:
                type: string
                format: uuid
              amountCents:
                type: integer
                format: int64
                minimum: 1
    RemainderRule:
      type: string
      enum: [host, proposer, earliest, random]
    TableArchive:
      type: object
      additionalProperties: false
      required: [id, name, emoji, archivedAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        emoji:
          type: string
        archivedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    QuickPickCode:
      type: string
      pattern: '^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{6}$'
    MemberRequestOutcome:
      type: object
      additionalProperties: false
      required: [userId, outcome]
      properties:
        userId:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [added, invited, not_added]
    TableCreationResult:
      type: object
      additionalProperties: false
      required: [table, outcomes]
      properties:
        table:
          $ref: '#/components/schemas/Table'
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/MemberRequestOutcome'
    BetLiveStats:
      type: object
      additionalProperties: false
      required: [gameId, league, status, period, clock, away, home, rows]
      properties:
        gameId:
          type: string
        league:
          type: string
          enum: [NBA, NFL]
        status:
          type: string
        period:
          type: [integer, 'null']
        clock:
          type: [string, 'null']
        away:
          $ref: '#/components/schemas/LiveTeam'
        home:
          $ref: '#/components/schemas/LiveTeam'
        rows:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [label, detail, proposed, locked, current, target, targetLabel]
            properties:
              label:
                type: string
                description: e.g. "Drake Maye passing yards" or "Combined score".
              detail:
                type: [string, 'null']
                description: e.g. the player's position and team.
              proposed:
                type: [integer, 'null']
                description: When the bet was proposed; null for bets made before snapshots.
              locked:
                type: [integer, 'null']
                description: When picks locked; null before lock.
              current:
                type: [integer, 'null']
              target:
                type: [number, 'null']
                description: The line or target this number is measured against, if the mode has one.
              targetLabel:
                type: [string, 'null']
    LiveTeam:
      type: object
      additionalProperties: false
      required: [abbreviation, score]
      properties:
        abbreviation:
          type: string
        score:
          type: [integer, 'null']
    TableSummary:
      type: object
      additionalProperties: false
      description: One of the caller's tables in a list. Never the whole member list.
      required: [id, name, emoji, host, memberCount, memberPreview, myDisabledPermissions, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        emoji:
          type: string
        host:
          type: boolean
          description: Whether the caller hosts this table.
        memberCount:
          type: integer
          minimum: 1
          maximum: 500
        memberPreview:
          type: array
          maxItems: 4
          description: The first members by join order, for avatars.
          items:
            type: string
            format: uuid
        myDisabledPermissions:
          type: array
          description: The caller's own permissions a host turned off here.
          items:
            type: string
            enum: [bets, text, react, gifs, polls]
        lastBetAt:
          type: string
          format: date-time
          description: When the table's most recent bet was proposed. Absent before its first bet.
        joinedAt:
          type: string
          format: date-time
          description: When the caller joined. The list orders by the later of this and lastBetAt.
    Table:
      type: object
      additionalProperties: false
      required: [id, name, emoji, memberIds, hostIds, remainderRule, hostsOnlyBets, u2pickEnabled, pollsEnabled, quickPicksEnabled, quickPickSharing, subscribedTo, disabledPermissions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 14
        emoji:
          type: string
        memberIds:
          type: array
          items:
            type: string
            format: uuid
        hostIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        remainderRule:
          $ref: '#/components/schemas/RemainderRule'
        hostsOnlyBets:
          type: boolean
        u2pickEnabled:
          type: boolean
        pollsEnabled:
          type: boolean
          description: Whether members can start new chat polls.
        quickPickCode:
          description: Present only for current table hosts.
          $ref: '#/components/schemas/QuickPickCode'
        quickPicksEnabled:
          type: boolean
        quickPickSharing:
          type: boolean
        subscribedTo:
          type: array
          items:
            type: string
            format: uuid
        disabledPermissions:
          type: object
          description: Per-member permissions disabled by a host; non-hosts see only their own.
          additionalProperties:
            type: array
            uniqueItems: true
            items:
              type: string
              enum: [bets, text, react, gifs, polls]
    DebtCap:
      type: object
      additionalProperties: false
      required: [capCents]
      properties:
        capCents:
          type: [integer, 'null']
          minimum: 0
          maximum: 2147483647
    BetProposal:
      type: object
      additionalProperties: false
      required: [modeId, config, wagerCents, durationSec, forFun]
      properties:
        modeId:
          $ref: '#/components/schemas/BetMode'
        gameId:
          type: string
          description: Required for game bets; absent for game-independent U2Pick.
        settledBy:
          type: string
          enum: [anyone, non_participants, hosts, me]
          description: U2Pick settler rule.
        config:
          $ref: '#/components/schemas/BetConfig'
          description: >-
            For U2Pick, the server normalizes config.question and
            config.options to match the validated question and choices.
            Other valid config fields are retained.
        question:
          type: string
          minLength: 1
          description: Required for U2Pick; ignored for game bets, whose question the server builds.
        choices:
          type: array
          minItems: 2
          uniqueItems: true
          items:
            type: string
            minLength: 1
        wagerCents:
          type: integer
          minimum: 0
          description: Non-4fun wagers must be between 10 and 1000 cents.
        durationSec:
          type: integer
          minimum: 30
          maximum: 600
          description: Pick window in whole seconds; the server assigns the deadline.
        forFun:
          type: boolean
        includesOvertime:
          type: boolean
          description: Only applicable to stat and score modes.
      allOf:
        - if:
            properties:
              forFun:
                const: false
            required: [forFun]
          then:
            properties:
              wagerCents:
                minimum: 10
                maximum: 1000
        - if:
            properties:
              modeId:
                const: u2pick
            required: [modeId]
          then:
            required: [question, choices]
            properties:
              question:
                maxLength: 120
              choices:
                maxItems: 6
                items:
                  type: string
                  minLength: 1
                  maxLength: 40
                  pattern: '^(?!\s*[Nn][Oo] [Gg][Uu][Ee][Ss][Ss]\s*$).+'
                  description: >-
                    Trimmed, case-insensitively unique, and not "No guess"
                    (reserved for joining without a pick). "Pass" is allowed
                    as a sports choice.
          else:
            required: [gameId]
            properties:
              gameId:
                type: string
              settledBy: false
        - if:
            properties:
              modeId:
                enum: [u2pick, choose_their_fate]
            required: [modeId]
          then:
            properties:
              includesOvertime: false
    BetMode:
      type: string
      enum: [either_or, king_of_the_hill, choose_their_fate, scorcerer, total_disaster, give_and_take, prop_hunt, u2pick]
    BetConfig:
      type: object
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: array
            items:
              type: string
    BetBaseline:
      type: object
      additionalProperties: false
      description: >-
        Snapshots of what a sports bet's mode follows (see GET
        /bets/{betId}/live), keyed by what they track: combined, margin,
        player:<id>, home_td, home_fg, away_td, away_fg.
      properties:
        proposed:
          type: object
          description: When the bet was proposed.
          additionalProperties:
            type: integer
        locked:
          type: object
          description: When picks locked.
          additionalProperties:
            type: integer
    Bet:
      type: object
      additionalProperties: false
      required: [id, tableId, proposerId, modeId, config, question, choices, wagerCents, forFun, status, locksAt, myPick, myParticipation, pickCount, pointsSettled, viewerCanCall, viewerCanOverride]
      properties:
        viewerCanCall:
          type: boolean
          description: >-
            The caller may call this Pending U2Pick's result now, by its settler
            rule. Computed with the rule the result call enforces.
        viewerCanOverride:
          type: boolean
          description: >-
            The caller is a host and this sports bet's points aren't settled, so
            they may wash it or set its result.
        id:
          type: string
          format: uuid
        tableId:
          type: string
          format: uuid
        proposerId:
          type: string
          format: uuid
        modeId:
          $ref: '#/components/schemas/BetMode'
        gameId:
          type: string
        config:
          $ref: '#/components/schemas/BetConfig'
        question:
          type: string
        choices:
          type: array
          items:
            type: string
        wagerCents:
          type: integer
          minimum: 0
        forFun:
          type: boolean
        status:
          type: string
          enum: [ACTIVE, PENDING, SETTLED, WASHED]
        locksAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        lockedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
        settledAt:
          type: string
          format: date-time
          description: Time the table host settled this bet's points, not when its outcome resolved.
        pointsSettled:
          type: boolean
          description: >-
            Whether the host has settled this bet's points. Distinct from
            status SETTLED, which means the bet outcome has resolved.
        baseline:
          $ref: '#/components/schemas/BetBaseline'
        includesOvertime:
          type: boolean
        settledBy:
          type: string
          enum: [anyone, non_participants, hosts, me]
        overriddenBy:
          type: string
          format: uuid
          description: The host who last overrode this sports bet's result.
        overriddenAt:
          type: string
          format: date-time
        calledBy:
          type: string
          format: uuid
        winningChoice:
          type: string
        washReason:
          type: string
        remainderRule:
          $ref: '#/components/schemas/RemainderRule'
        remainderHostId:
          type: string
          format: uuid
          description: >-
            For a locked bet with the host remainder rule, the host chosen
            uniformly at random from the table's current hosts at lock.
            The recipient remains fixed even if host membership later changes.
        sourceBetId:
          type: string
          format: uuid
        sourceTableId:
          type: string
          format: uuid
        overridden:
          type: boolean
        deltasCents:
          type: object
          description: Resolved per-user deltas in cents.
          additionalProperties:
            type: integer
            format: int64
        pickCount:
          type: integer
          minimum: 0
          description: Number of participants with a selection; excludes those with no guess.
        myPick:
          type: [string, 'null']
          description: The authenticated user's own selection; null means no guess or no participation.
        myParticipation:
          type: string
          enum: [not_joined, no_guess, picked]
          description: The caller's own participation state, including while ACTIVE.
        picks:
          type: array
          description: Omitted while ACTIVE.
          items:
            type: object
            additionalProperties: false
            required: [userId, choice]
            properties:
              userId:
                type: string
                format: uuid
              choice:
                type: string
        noGuessUserIds:
          description: >-
            Participants with no guess, omitted while ACTIVE. No guess does
            not place the participant in the pot.
          $ref: '#/components/schemas/UuidList'
      allOf:
        - if:
            properties:
              myParticipation:
                const: picked
            required: [myParticipation]
          then:
            properties:
              myPick:
                type: string
                minLength: 1
              pickCount:
                minimum: 1
          else:
            properties:
              myPick:
                type: 'null'
        - if:
            properties:
              status:
                const: ACTIVE
            required: [status]
          then:
            properties:
              picks: false
              noGuessUserIds: false
              remainderRule: false
              remainderHostId: false
          else:
            required: [picks, noGuessUserIds, remainderRule]
            properties:
              picks: true
              noGuessUserIds: true
              remainderRule: true
            allOf:
              - if:
                  properties:
                    remainderRule:
                      const: host
                  required: [remainderRule]
                then:
                  required: [remainderHostId]
                  properties:
                    remainderHostId: true
                else:
                  properties:
                    remainderHostId: false
        - if:
            properties:
              status:
                enum: [ACTIVE, PENDING]
            required: [status]
          then:
            properties:
              calledBy: false
              winningChoice: false
              washReason: false
              deltasCents: false
              pointsSettled:
                const: false
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, username, hue, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          minLength: 3
          maxLength: 15
          pattern: '^[a-z0-9_]+$'
        hue:
          type: integer
          minimum: 1
          maximum: 5
        role:
          type: string
          enum: [PLAYER, ADMIN]
    User:
      type: object
      additionalProperties: false
      required: [id, username, hue]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          minLength: 3
          maxLength: 15
          pattern: '^[a-z0-9_]+$'
        hue:
          type: integer
          minimum: 1
          maximum: 5
    DeletedUser:
      type: object
      additionalProperties: false
      required: [id, displayName, deleted]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          const: Deleted user
        deleted:
          const: true
    ProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        username:
          type: string
          description: >-
            Trim ECMAScript whitespace and lowercase before validating 3–15
            lowercase ASCII alphanumeric/underscore characters and
            case-insensitive uniqueness.
        hue:
          type: integer
          minimum: 1
          maximum: 5
    ModerationPerson:
      type: object
      additionalProperties: false
      required: [id, username, status, strikes]
      properties:
        id: {type: string, format: uuid}
        username: {type: [string, 'null']}
        status:
          type: string
          enum: [ACTIVE, FROZEN, DELETED]
        strikes: {type: integer, minimum: 0, maximum: 3}
    ModerationReport:
      type: object
      additionalProperties: false
      required: [id, reason, note, status, createdAt, reporter, target]
      properties:
        id: {type: string, format: uuid}
        reason:
          type: string
          enum: [harassment, settlement, spam, offensive, other]
        note: {type: string}
        status:
          type: string
          enum: [OPEN, RESOLVED, DISMISSED]
        createdAt: {type: string, format: date-time}
        reporter:
          $ref: '#/components/schemas/ModerationPerson'
        target:
          $ref: '#/components/schemas/ModerationPerson'
        tableId: {type: [string, 'null'], format: uuid}
        tableName: {type: [string, 'null']}
        messageSnapshot: {type: [string, 'null']}
    DemoWorld:
      type: object
      required: [users, follows, blocks, tables]
      properties:
        users: {type: integer}
        follows: {type: integer}
        blocks: {type: integer}
        tables: {type: integer, description: Unarchived tables.}
        bots:
          description: >-
            GET only. What the bots have done since they started or the last
            reset; null when bots are off.
          type: [object, 'null']
          required: [since, lastTick, queued, done]
          properties:
            since: {type: string, format: date-time}
            lastTick: {type: [string, 'null'], format: date-time}
            queued: {type: integer}
            done:
              type: object
              description: Count per action and outcome, e.g. "pick updated".
              additionalProperties: {type: integer}
    DemoAccount:
      type: object
      required: [id, username, hue, role, frozen]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        hue: {type: integer, minimum: 1, maximum: 5}
        role: {type: string, enum: [PLAYER, ADMIN]}
        frozen: {type: boolean}
    DevSource:
      type: object
      required: [name, title, description, league, running]
      properties:
        name: {type: string}
        title: {type: string}
        description: {type: string}
        league: {type: [string, 'null'], enum: [NBA, NFL, null]}
        running: {type: boolean}
        error: {type: string, description: "Why the file can't be used now; the last good state stays."}
        startedAt: {type: string, format: date-time}
        games: {type: integer}
        players: {type: integer}
        lengthSeconds: {type: integer}
        positionSeconds: {type: integer}
        speed: {type: number}
        paused: {type: boolean}
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or credentials invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The authenticated user cannot perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource does not exist or is not visible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: The requested data is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
