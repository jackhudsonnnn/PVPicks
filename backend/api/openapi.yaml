openapi: 3.1.0
info:
  title: P2Picks backend API
  version: 0.1.0-draft
  description: >-
    Phase 0 draft. Dev implements authentication, admin health, table and
    settings and debt reads, relationship and invitation reads,
    invite preference replacement, debt-cap updates, feedback submission,
    follow/block mutations, table creation, member requests, profile and betting settings,
    invitation responses, reaction mutations and chat
    unread-state reads and updates, chat window reads and text/GIF sending,
    U2Pick proposal, picks and results, host points settlement, and receipt,
    group and balance-change-review reads and actions. Other operations remain
    unimplemented.
    This contract is not ready for client generation until the complete
    Phase 0 review.
    In dev, browser requests are same-origin. All POST, PUT, PATCH and DELETE
    requests, including login and logout, require the X-CSRF-TOKEN header
    obtained from GET /auth/csrf, and an allowed Origin. Invalid or missing
    CSRF protection returns 403 before performing the operation. The CSRF
    requirement is not yet enumerated on every draft operation below.
    Admin audit views must not expose ACTIVE participation, picks or
    user-specific participation-derived counts. Admin accounts cannot access
    player APIs; login, logout and GET /me remain available. Picks are revealed
    when the bet locks.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /auth/csrf:
    get:
      operationId: getCsrfToken
      security: []
      summary: Obtain a CSRF token before a browser mutation
      description: >-
        Returns a token associated with a host-only HttpOnly CSRF cookie.
        The client sends the returned token in X-CSRF-TOKEN on mutations.
        This response must not be cached. Fetch a new token after login or
        logout; a token from before rotation will not match the new cookie.
      responses:
        '200':
          description: CSRF token and its accompanying cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /config:
    get:
      operationId: getAppMode
      security: []
      summary: Which mode the backend runs in
      description: >-
        Signed in or out. `dev` (local development: the demo picker) or
        `lan` (the LAN watch party: sign-in codes, the party table).
        Production isn't configured yet. The client chooses its sign-in from
        this.
      responses:
        '200':
          description: The mode.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [mode]
                properties:
                  mode:
                    type: string
                    enum: [dev, lan, prod]
  /auth/login:
    post:
      operationId: login
      security: []
      summary: Admin sign-in with username and password
      description: >-
        Admins only: players have no password and sign in with their code
        (/auth/code). A player's username gets the same 401 as a wrong
        password. Failed sign-ins are
        throttled (429 `rate_limited`, with Retry-After): by default 10
        failures per account name or 50 per client address within 15
        minutes block further attempts, even correct ones, until the window
        ends; a success clears the account's count. In dev, normalize the username
        by trimming and lowercasing; verify the password exactly. Unknown,
        frozen and deleted accounts and wrong passwords receive the same 401.
        Login rotates the CSRF token. An existing session, if any, is revoked
        before the new one is issued.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '204':
          description: Authenticated; the server sets the session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Origin or CSRF rejected, or, after a correct password, the account
            is frozen (code `account_frozen`). Frozen accounts can't sign in;
            freezing also ends their sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/code:
    post:
      operationId: signInWithCode
      security: []
      summary: Player sign-in with their code
      description: >-
        Players sign in with the code an admin shows them: typed with their
        username, or opened from their QR link /signin#<playerId>.<code>,
        which sends the player's id (so a rename doesn't break the link; the
        code stays in the URL fragment). Codes are 4 characters from
        ABCDEFGHJKMNPQRSTUVWXYZ23456789; case, spaces and dashes are
        ignored, and the username is trimmed and case-insensitive. A code
        stays the same until an admin rotates it. Wrong codes are throttled
        per player, or per typed name when it matches nobody (10 per 15
        minutes by default), with a per-address backstop (100); over a
        limit, 429 even for a right code until the window ends or an admin
        clears it. An unknown username and a wrong code get the same 401.
        A stale or revoked session cookie doesn't block this. Signing in
        rotates the CSRF token and revokes the caller's existing session,
        if any.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Exactly one of username (typed) or player (QR link), plus the code.
              required: [code]
              minProperties: 2
              maxProperties: 2
              properties:
                username:
                  type: string
                player:
                  type: string
                  format: uuid
                code:
                  type: string
      responses:
        '204':
          description: Signed in; the server sets the session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The username (or player) and code don't match (code `invalid_code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >-
            Origin or CSRF rejected, or the code is right but the account is
            frozen (code `account_frozen`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/password:
    post:
      operationId: changePassword
      summary: Change your own password (admins)
      description: >-
        Admins only; a player gets 403 `not_admin` (players have no
        password). Needs the current password; ends the account's other
        sessions and keeps this one. Wrong current passwords count toward
        the sign-in throttle.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
      responses:
        '204':
          description: Changed.
        '400':
          description: Malformed body, or a new password the rules reject (code `weak_password`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            The current password is wrong (code `wrong_password`), the caller
            is a player (code `not_admin`), or origin or CSRF rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      description: >-
        Revoke the current session server-side, expire its cookie and rotate
        the CSRF token. Other sessions are unaffected.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session ended.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me:
    get:
      operationId: getMe
      summary: Get the authenticated user
      responses:
        '200':
          description: Current user, with their role (admins cannot use player APIs).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/profile:
    patch:
      operationId: updateMyProfile
      summary: Change the current user's display profile
      description: >-
        Dev implementation. Normalize the username before validation and
        comparison; a taken name returns 409 with code username_taken. A rename
        releases the old username and changes future login, but does not revoke
        existing sessions or rewrite historical free-text chat. A matching retry
        rechecks authentication and returns the current profile without
        reapplying. Changes write an internal event, not a delivered update.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/debt:
    get:
      operationId: getMyDebt
      summary: Get current debt in integer cents
      description: >-
        Sum negative table balances and negative open person settle-up
        nets; positive balances do not offset debt elsewhere. Current
        non-archived memberships contribute unsettled non-4fun results minus
        pending picked wagers. Open receipts include archived tables, and a
        receipt closed by a sent settle still counts until the receiver's
        48-hour reject window passes. The response
        uses one database snapshot and does not enforce the cap.
      responses:
        '200':
          description: Current debt.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [debtCents]
                properties:
                  debtCents:
                    type: integer
                    format: int64
                    minimum: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/balance:
    get:
      operationId: getMyBalance
      summary: Your balance across every table plus open settle-ups
      description: >-
        The sum of balanceCents over your current, non-archived tables plus the
        net of your open (unpaid) settle-up receipts. A host settle moves points
        from a table into receipts, so it leaves this unchanged. One database
        snapshot.
      responses:
        '200':
          description: Your balance.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [balanceCents]
                properties:
                  balanceCents:
                    type: integer
                    format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/debt-cap:
    get:
      operationId: getMyDebtCap
      summary: Get the current debt cap
      description: An absent cap row or a null stored cap means disabled.
      responses:
        '200':
          description: The current cap, or null when disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtCap'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateMyDebtCap
      summary: Set or disable the debt cap
      description: >-
        A null cap disables the limit. A change is allowed only when current
        debt is zero, including when setting the same value again with a new
        key. New caps must be whole points in cents (a multiple of 100), at
        most 2147483600 cents. Matching retries do not reapply the update even
        if debt has since changed. Existing fractional-point cap values
        remain readable. Proposal, pick and lock transactions enforce the cap.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DebtCap'
                - type: object
                  properties:
                    capCents:
                      type: [integer, 'null']
                      multipleOf: 100
      responses:
        '204':
          description: Cap updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /tables/{tableId}/bets:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      operationId: listTableBets
      summary: List the table's live bets
      description: >-
        The live set, oldest first: Active and Pending bets, and resolved
        non-4fun bets whose points aren't settled yet (the same set that
        blocks deleting the table). Older bets are read one at a time
        (getBet) or per member (listMemberBets).
      responses:
        '200':
          description: Each bet contains only the caller's own pick while Active.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: proposeBet
      summary: Propose a bet at a table
      description: >-
        Dev implementation for U2Pick and every sports mode except
        choose_their_fate. Sports modes send gameId and includesOvertime
        (default true; ignored by scorcerer) and a config: score modes
        config.line in half points (the total for total_disaster, the home
        team's spread for give_and_take); player modes config.stat (a key
        from GET /games/{gameId}/players) and config.players (player ids from
        that game: one for prop_hunt, two for either_or and king_of_the_hill)
        plus config.line for prop_hunt (half points, above the player's
        current number) and king_of_the_hill (a whole-number target above
        both players' numbers); scorcerer (NFL and NBA) takes no config. The
        server builds the question and choices from the stored game and
        players. Terms the game can't take answer 409 invalid_terms. A game
        bet can be proposed until its game is Final, canceled or postponed
        (409 game_unavailable); picks lock at the window's end or the game's
        start, whichever is first, and some picks wash at lock (domain rules,
        "Wash triggers").
        The server checks table permissions, wager rules and debt cap, and
        assigns the bet identity and lock time. The
        proposer is the visible author but does not join the bet automatically.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/BetProposal'
                - $ref: '#/components/schemas/JackblackProposal'
                - $ref: '#/components/schemas/HoldemProposal'
      responses:
        '201':
          description: Bet created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /bets/{betId}/live:
    parameters:
      - name: betId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getBetLiveStats
      summary: A sports bet's live stats
      description: >-
        What the bet's mode follows (the combined score, the home margin, each
        chosen player's stat, or each team's touchdowns and field goals), as it
        was when the bet was proposed, when picks locked, and now, with the
        game's score and clock. Same access as the bet. 404 for a bet without
        a game (U2Pick). Bets made before these snapshots existed have only the
        current numbers.
      responses:
        '200':
          description: Live stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetLiveStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/bets:
    get:
      operationId: listMyBets
      summary: List bets at the caller's current tables, newest first
      description: >-
        Bets at every non-archived table the caller is a member of (or one of
        them with tableId), using the same projection as listTableBets: each
        Active bet contains only the caller's own pick.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, PENDING, SETTLED, WASHED]
        - $ref: '#/components/parameters/OptionalTableId'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: A page of bets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tables/{tableId}/tomatoes:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      operationId: listRecentTomatoes
      summary: Tomatoes thrown at the table in the last 30 seconds
      description: >-
        For animating throws after a tomatoes.changed invalidation. Requires
        current membership of a non-archived table. Throws involving anyone
        the caller is in a block relationship with (either direction) are
        omitted.
      responses:
        '200':
          description: Recent throws, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TomatoThrow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: throwTomato
      summary: Throw a tomato at another member
      description: >-
        A playful effect every member sees; it never changes points or files
        a report. Requires the caller's reaction permission. The target must
        be another active current member with no block relationship with the
        caller in either direction (otherwise 404). One throw per thrower per
        table every 5 seconds (429 with Retry-After).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetId]
              properties:
                targetId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Thrown.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tables/{tableId}/balances:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      operationId: listTableBalances
      summary: Each current member's balance at the table
      description: >-
        balanceCents is the member's balance: ledger deltas from resolved bets
        whose points are not yet settled, minus their points in play (wagers in
        Pending, locked, non-4fun pots and each Jackblack game's worst case),
        so it assumes they lose everything still in play. unsettledCents is
        only the resolved part, what the next host settle moves; pending bets
        never enter a settle. Active picks are never counted. Members can
        already read every input through bet reads. Requires current
        membership of a non-archived table.
      responses:
        '200':
          description: One balance per current member.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TableBalance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tables/{tableId}/members/{userId}/balance:
    parameters:
      - $ref: '#/components/parameters/TableId'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getMemberBalance
      summary: One member's balance with each ticket they have in play
      description: >-
        For the Peers tab's what-if view. Each ticket in play (Pending,
        non-4fun pots the member picked in, and Jackblack games they play) has
        loseCents, what it adds to the balance if it loses (already counted in
        balanceCents), and winCents, what it adds if it wins: the payout if the
        member's pick wins, from the resolution calculator, or a Jackblack
        game's best case. balanceCents is unsettledCents plus every loseCents.
        Oldest lock first. Requires current membership of a non-archived table;
        the member must be a current member too.
      responses:
        '200':
          description: The member's balance and tickets in play.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberBalance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /bets/{betId}:
    parameters:
      - $ref: '#/components/parameters/BetId'
    get:
      operationId: getBet
      summary: Get a bet visible to the current table member
      responses:
        '200':
          description: >-
            Bet view. Other players' participation and picks are omitted while
            ACTIVE; the caller can see their own pick and aggregate counts.
            Picks are revealed after lock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /bets/{betId}/pick:
    parameters:
      - $ref: '#/components/parameters/BetId'
    put:
      operationId: putMyPick
      summary: Add or change the current user's pick
      description: Dev implementation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [choice]
              properties:
                choice:
                  type: string
                  minLength: 1
      responses:
        '204':
          description: Pick accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: clearMyPick
      summary: Clear the current user's guess
      description: Dev implementation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Pick cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /bets/{betId}/jackblack:
    parameters:
      - $ref: '#/components/parameters/BetId'
    get:
      operationId: getJackblackGame
      summary: A Jackblack game as table members see it
      description: >-
        Who's in while the join window is open, then the cards: every seat's
        hands, to every member (players, the dealer and members not playing
        alike), and whose turn it is. The dealer's second card is "??" until
        it's turned over; the shoe is never sent.
      responses:
        '200':
          description: The game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JackblackGame'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /bets/{betId}/jackblack/seat:
    parameters:
      - $ref: '#/components/parameters/BetId'
    put:
      operationId: joinJackblack
      summary: Join a Jackblack game
      description: >-
        While the join window is open, within the proposer's players range. Your worst case over
        the whole game (every hand split and doubled and lost, every round)
        must fit your points limit; it's checked again at the deal, where
        anyone who can't cover it is dropped, latest joiner first.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Joined (or already in).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: leaveJackblack
      summary: Leave a Jackblack game before the deal
      description: >-
        Anyone in may leave before the deal, the proposer included; leaving
        takes you out of the bet entirely.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Left (or wasn't in).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /bets/{betId}/jackblack/actions:
    parameters:
      - $ref: '#/components/parameters/BetId'
    post:
      operationId: playJackblack
      summary: Make a decision in a Jackblack game
      description: >-
        hit, stand, double or split is your choice for your current hand this
        step; the cards come out only once everyone still playing has chosen
        or the decision timer runs out (no choice stands). deal is the round's
        dealer's one button on their turn (the game's dealerMove: flip, hit
        or stand). A tap after the timer ran out is ignored (the timeout
        applies instead). Not allowed right now: 409 jackblack_refused with
        the reason.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action:
                  type: string
                  enum: [hit, stand, double, split, deal]
      responses:
        '204':
          description: Done.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /bets/{betId}/holdem:
    parameters:
      - $ref: '#/components/parameters/BetId'
    get:
      operationId: getHoldemGame
      summary: A Hold'em game as table members see it
      description: >-
        Who's in while the join window is open, then the game. Stacks, bets,
        the board and whose turn it is are public; hole cards are only your
        own (me.hole) until a showdown, where everyone still in shows (no
        mucking: the audit reveals every hand after the game anyway). The deck is never sent.
        Once the game is over every hand's hole cards and every shuffle
        secret are revealed (the audit).
      responses:
        '200':
          description: The game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldemGame'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /bets/{betId}/holdem/seat:
    parameters:
      - $ref: '#/components/parameters/BetId'
    put:
      operationId: joinHoldem
      summary: Join a Hold'em game
      description: >-
        While the join window is open, within the proposer's players
        range. Losing your 10-big-blind stack in every hand (one hand per
        player, counting you) must fit your points limit; it's checked again
        at the deal for the final count.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Joined (or already in).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: leaveHoldem
      summary: Leave a Hold'em game before the deal
      description: >-
        Anyone in may leave before the deal, the proposer included; leaving
        takes you out of the bet entirely.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Left (or wasn't in).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /bets/{betId}/rematch:
    parameters:
      - $ref: '#/components/parameters/BetId'
    post:
      operationId: runItBack
      summary: Run a finished card game back
      description: >-
        On a resolved or washed Jackblack or Hold'em game: the first call
        proposes the same game again (same rules and stakes) with a 30-second
        join window, the caller in it; later calls join that one rematch.
        Like any game it washes at the deal with fewer than its minimum
        players. 409 rematch_refused when the game isn't over or its rematch
        has started; 409 debt_cap_exceeded when your points limit can't cover
        it.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The rematch was started; it's returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bet'
        '200':
          description: You joined (or were already in) the running rematch; it's returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /bets/{betId}/holdem/actions:
    parameters:
      - $ref: '#/components/parameters/BetId'
    post:
      operationId: playHoldem
      summary: Make a move in a Hold'em game
      description: >-
        On your turn: fold, check, call, all_in, or raise with amount (the
        raise-to total for this street, at least the current bet plus the
        last full raise, unless it's all in). While you're
        in the hand and it isn't your turn: a pre-move, check_fold (check if
        you can, otherwise fold) or call_any (check or call whatever the bet
        is), played the moment the action reaches you, or no_pre_move to
        clear it; it lasts one decision. A tap after the turn
        timer ran out is ignored (the timeout applies instead: check if you
        can, otherwise fold). Not allowed right now: 409 holdem_refused with
        the reason.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action:
                  type: string
                  enum: [fold, check, call, raise, all_in, check_fold, call_any, no_pre_move]
                amount:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Only with raise.
      responses:
        '204':
          description: Done.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /bets/{betId}/settle:
    parameters:
      - $ref: '#/components/parameters/BetId'
    post:
      operationId: settleCustomBet
      summary: Call the result of a U2Pick bet
      description: >-
        Dev implementation for U2Pick.
        Only a settler authorized by the proposal may call a pending original
        U2Pick. Game bets are settled exclusively by the sports feed.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [winningChoice]
              properties:
                winningChoice:
                  type: [string, 'null']
                  description: Null indicates an outcome outside the choices; a string must match a choice exactly.
      responses:
        '204':
          description: Result accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /bets/{betId}/override:
    parameters:
      - $ref: '#/components/parameters/BetId'
    post:
      operationId: overrideSportsBet
      summary: A host washes a sports bet or sets its result
      description: >-
        Dev implementation for the score modes. A current host may wash
        (winningChoice null) or set the result to one of the bet's choices
        while it is Active (it locks first), Pending, or resolved with the
        table's points not yet settled (409 points_settled after). A
        correction appends compensating ledger entries. No reason is asked
        for. The override is recorded on the bet (overriddenBy, overriddenAt)
        and posted in chat naming the host.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [winningChoice]
              properties:
                winningChoice:
                  type: [string, 'null']
      responses:
        '204':
          description: Overridden.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /bets/{betId}/wash:
    parameters:
      - $ref: '#/components/parameters/BetId'
    post:
      operationId: washQuickPick
      summary: Wash an eligible Quick Pick copy
      description: >-
        A subscriber-table host may wash their copy before table points
        settlement, including after resolution. Reversal of posted deltas must
        use atomic zero-sum compensating ledger entries.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Copy washed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tables:
    get:
      operationId: listMyTables
      summary: List the current user's tables
      description: >-
        Returns current, non-archived memberships as summaries (at most 100,
        the table limit), most recent activity first: the later of the
        table's last bet and when the caller joined. Summaries never carry
        whole member lists; GET /tables/{tableId} returns the full table.
      responses:
        '200':
          description: Tables the user belongs to.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/TableSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTable
      summary: Create a table hosted by the current user
      description: >-
        Creates the table and applies eligible initial member requests atomically.
        On retry the table view reflects current authorized state, while outcomes
        remain those of the original request. Returns 404 if access is lost.
        Returns 409 `table_limit` when the caller is already at 100 tables (a
        matching retry of an earlier success still replays).
        Rate limited to 10 new tables an hour per account (429).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, emoji]
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Trimmed before validation and storage; at most 14 Unicode code points after trimming.
                emoji:
                  type: string
                  description: One ICU-supported RGI emoji sequence.
                memberIds:
                  type: array
                  uniqueItems: true
                  maxItems: 100
                  items:
                    type: string
                    format: uuid
                  description: Optional requested members; eligibility is evaluated individually.
      responses:
        '201':
          description: Table created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableCreationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tables/archives:
    get:
      operationId: listMyTableArchives
      summary: List the caller's available table chat archives
      description: >-
        Dev implementation. An active user sees archives for tables where they
        were a member at deletion, for 90 days (2160 hours) after deletion.
        Expiry removes access and listing, but does not delete retained data.
      responses:
        '200':
          description: Available archives, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TableArchive'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tables/{tableId}:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      operationId: getTable
      summary: Get a table visible to the current user
      description: >-
        Requires current membership. Missing, archived and non-member tables
        return 404. Quick Pick codes are visible only to current hosts; disabled
        permissions are visible to hosts for all members and otherwise only
        for the caller.
      responses:
        '200':
          description: Table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTable
      summary: Update table name and emoji
      description: >-
        Only a current host may update the table. An actual change adds a
        neutral system chat notice without storing the table name in chat.
        No changes are made for unchanged values. A matching retry rechecks
        host access and returns the current table without reapplying the update.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Trimmed before validation and storage; at most 14 Unicode code points after trimming.
                emoji:
                  type: string
                  description: One ICU-supported RGI emoji sequence.
      responses:
        '200':
          description: Updated table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteTable
      summary: Delete an eligible table
      description: >-
        Dev implementation. Only a host may delete a table. Active or Pending bets and resolved
        non-4fun bets whose points have not been settled prevent deletion.
        The table is removed from normal active-table views; its chat remains
        read-only for members at deletion, subject to block filtering and
        account-deletion rules, for 90 days after deletion. Open receipts remain
        part of debt; personal settlement-history actions are not implemented.
        Existing Quick Pick copies survive. Pending invitations are cancelled
        and subscriptions disconnected. An authorized matching retry succeeds
        without reapplying; a fresh key for an archived table returns 404.
        Concurrent membership changes can return a retryable 409.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Table deleted from normal active-table views.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: Unsettled bets, a membership race, or an idempotency conflict.
  /tables/{tableId}/settings:
    parameters:
      - $ref: '#/components/parameters/TableId'
    patch:
      operationId: updateTableSettings
      summary: Change table-wide betting settings
      description: >-
        Only a current host may change these switches. Changes affect future
        proposals and Quick Pick fan-out, not existing bets. Actual changes
        create neutral system chat notices and internal outbox events. An
        unchanged value is a no-op. A matching retry rechecks host access and
        returns the current table without reapplying earlier values. Proposal
        and Quick Pick services are not implemented yet.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                hostsOnlyBets:
                  type: boolean
                u2pickEnabled:
                  type: boolean
                pollsEnabled:
                  type: boolean
                  description: >-
                    Whether members can start new chat polls. Turning it off
                    doesn't close existing polls; they keep taking votes.
                jackblackAccess:
                  $ref: '#/components/schemas/JackblackAccess'
                holdemAccess:
                  $ref: '#/components/schemas/HoldemAccess'
      responses:
        '200':
          description: Updated table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tables/{tableId}/members:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      operationId: searchTableMembers
      summary: Search a table's members by username
      description: >-
        Members of one of the caller's tables whose username contains `q`,
        by username, 50 at a time. Same access as the table (404 otherwise).
        Rate limited to 60 a minute per account.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_ ]{1,40}$'
          description: 1 to 15 letters, numbers or underscores (trimmed, case-insensitive).
        - name: cursor
          in: query
          schema:
            type: string
          description: The previous page's nextCursor.
      responses:
        '200':
          description: Matching member ids.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items:
                      type: string
                      format: uuid
                  nextCursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: addTableMembers
      summary: Add or invite eligible users
      description: >-
        The host requests additions. Each user's relationship, invite
        preferences, pending invitations and blocks determine the outcome.
        Eligible open preferences add immediately; request creates a pending
        invitation. Frozen, deleted, unavailable, blocked, already-present and
        otherwise ineligible accounts all return not_added. So do accounts at
        their 100-table limit, a table at its 500-member limit, and, for a
        request, accounts with 100 requests waiting (no request is created).
        A request older than 30 days has expired and doesn't block a new one.
        Matching retries require current host access and return original
        outcomes without repeating actions. Pending invitations are not
        announced in table chat.
        Rate limited to 30 calls an hour per account (429); each call takes
        up to 100 people.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userIds]
              properties:
                userIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Per-user outcomes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberRequestOutcome'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tables/{tableId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/TableId'
      - $ref: '#/components/parameters/UserId'
    delete:
      operationId: removeTableMember
      summary: Remove another member
      description: >-
        Dev implementation. A current host may remove another current member,
        including a frozen member, but must first demote another host. Removal
        is blocked while any table bet is Active or Pending, or any resolved
        non-4fun bet awaits points settlement. A 409 with code
        member_removal_unsettled allows a client to offer permission controls;
        member_removal_host means the target must first be demoted.
        Records and receipts remain, pending invitations involving the target
        are cancelled, and their chat read position is retained. Matching
        retries recheck actor access and do not remove a subsequently readded
        member. The outbox event is internal and delivery is not implemented.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Member removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tables/{tableId}/hosts/{userId}:
    parameters:
      - $ref: '#/components/parameters/TableId'
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: promoteTableHost
      summary: Promote a member to host
      description: |
        A current host may promote a current member, including a frozen member.
        Promotion clears all member permission restrictions. A current host
        target is a successful no-op. Actual changes create a system chat line
        using the subject's current display name; deleted subjects display as
        Deleted user. Matching retries recheck current host access and target
        membership without reapplying.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Host added.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: demoteTableHost
      summary: Demote a host, retaining at least one host
      description: |
        A current host may demote a current member, including themselves,
        provided at least one other active host remains. A non-host target is
        a successful no-op. Demotion permanently cancels that host's pending
        invitations for this table and does not restore prior member limits.
        A matching retry rechecks current host access; a host who has stepped
        down therefore receives 403 on a retry until promoted again. A later
        account freeze can still leave a table without an active host.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Host demoted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: No other active host would remain, or the idempotency key conflicts.
  /tables/{tableId}/members/{userId}/permissions:
    parameters:
      - $ref: '#/components/parameters/TableId'
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: updateMemberPermission
      summary: Enable or disable a permission for a non-host member
      description: |
        A current host may change another current non-host member's permission,
        including a frozen member. Hosts always retain every permission.
        Changes do not create a chat message. A matching retry rechecks current
        access and target role without reapplying the original change. A
        non-host caller receives 403; a missing, archived or inaccessible table,
        unavailable user or non-member target receives 404; a host target or
        conflicting idempotency key receives 409. Bet authorization is not yet
        implemented; storing the bets permission does not enforce it.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [permission, enabled]
              properties:
                permission:
                  type: string
                  enum: [bets, text, react, gifs, polls]
                enabled:
                  type: boolean
      responses:
        '204':
          description: Permission updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tables/{tableId}/quick-picks/share:
    parameters:
      - $ref: '#/components/parameters/TableId'
    post:
      operationId: enableQuickPickSharing
      summary: Enable sharing using the table's existing code
      description: >-
        Dev implementation; requires a current host and Quick Picks enabled.
        Matching retries recheck access and do not reapply. Changes write
        neutral chat and internal outbox events; no event delivery exists.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Sharing enabled.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: disableQuickPickSharing
      summary: Disable sharing without deleting the table's code
      description: >-
        Dev implementation; current hosts can disable sharing. Existing
        subscribers are disconnected; existing copies and the code remain.
        Authorized matching retries do not reapply.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Sharing disabled.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tables/{tableId}/quick-picks/rotate:
    parameters:
      - $ref: '#/components/parameters/TableId'
    post:
      operationId: rotateQuickPickCode
      summary: Rotate a table's code and disconnect old subscribers
      description: >-
        Dev implementation; current hosts can rotate whether or not sharing
        is enabled. Incoming subscriptions are disconnected and copies remain.
        A matching retry rechecks host access and returns the current code,
        without rotating again. Historical codes are not permanently reserved;
        subscription authorization and safe code reuse require further design.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: New code.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code]
                properties:
                  code:
                    $ref: '#/components/schemas/QuickPickCode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tables/{tableId}/quick-picks/subscribe:
    parameters:
      - $ref: '#/components/parameters/TableId'
    post:
      operationId: subscribeQuickPicks
      summary: Subscribe the table to a sharing source by code
      description: >-
        Only a host of a table with Quick Picks enabled may subscribe it to a
        different table that is currently sharing. Reject duplicate
        subscriptions. Backfill eligible Active original bets already open at
        the source, then copy new originals. Copies never fan out. A target
        with U2Pick disabled does not receive U2Pick copies.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  description: Spaces and hyphens are ignored; matching ignores case.
      responses:
        '204':
          description: Subscribed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: unsubscribeQuickPicks
      summary: Unsubscribe from one source without deleting existing copies
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: sourceTableId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Unsubscribed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /chat/{tableId}/messages:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      operationId: listChatMessages
      summary: Read a window of table chat
      description: >-
        Dev supports current members of non-archived tables and archive members
        within 90 days after deletion. Archived chat is read-only. With no parameter,
        returns up to the latest 30 visible messages. Use around with a visible
        message ID (such as firstUnreadMessageId) for up to five preceding
        messages and 25 from that message onward. Use before or after with
        returned opaque cursors for up to 25 older or newer messages. Supply
        at most one parameter. Items are ordered oldest first. Visible text
        and GIF messages exclude deleted authors and authors blocked by the
        caller; bet, system and settlement messages remain visible. Reactions
        from deleted users are omitted, but reactions on visible messages are
        not otherwise filtered by blocks. Bet messages contain no picks;
        settlement summaries contain original amounts and parties only.
        Previous cursors are null when no older visible messages exist. Every
        nonempty window has a next cursor, including at the current end, so
        clients can retain it and fetch later arrivals without gaps. An empty
        window has null cursors; retain the prior next cursor to poll again.
        Cursors are bound to the user and table and survive boundary-message
        deletion. An unavailable or hidden around anchor returns 404.
      parameters:
        - name: before
          in: query
          description: The previousCursor from an earlier response.
          schema:
            type: string
        - name: after
          in: query
          description: The nextCursor from an earlier response.
          schema:
            type: string
        - name: around
          in: query
          description: A currently visible message ID, including firstUnreadMessageId.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A chat window.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, previousCursor, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatMessage'
                  previousCursor:
                    type: [string, 'null']
                  nextCursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tables/{tableId}/messages:
    parameters:
      - $ref: '#/components/parameters/TableId'
    post:
      operationId: sendChatMessage
      summary: Send a text or GIF to a table
      description: >-
        Dev requires current membership in a non-archived table and the
        relevant text or GIF permission. Text is trimmed as in the prototype,
        must be valid PostgreSQL text and contain 1–2000 Unicode code points
        after trimming. GIF IDs are restricted to the current prototype
        catalog. A matching retry rechecks authentication, membership,
        permission and unchanged message content, then returns the original
        201 representation without creating another message. It does not
        include later reactions. A removed or changed message, missing table
        or lost membership returns 404; a disabled permission returns 403. Reusing the
        key for a different request returns 409. This stores an internal outbox
        event but does not deliver chat. Rate limiting is not
        implemented in dev.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [kind, text]
                  properties:
                    kind:
                      const: text
                    text:
                      type: string
                      minLength: 1
                      description: 1–2000 Unicode code points after trimming.
                - type: object
                  additionalProperties: false
                  required: [kind, gifId]
                  properties:
                    kind:
                      const: gif
                    gifId:
                      type: string
                      minLength: 1
                      enum: [g1, g2, g3, g4, g5, g6, g7, g8, g9, g10, g11, g12, g13, g14, g15, g16, g17, g18, g19, g20, g21, g22, g23, g24]
      responses:
        '201':
          description: Message created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tables/{tableId}/polls:
    parameters:
      - $ref: '#/components/parameters/TableId'
    post:
      operationId: createChatPoll
      summary: Start a poll in a table's chat
      description: >-
        The caller must be a current member of a non-archived table with the
        polls permission, and the table must have polls on (403 polls_off).
        The question (1–200 code points) and 2–6 options (1–80 code points
        each, different ignoring case) are trimmed like text messages. A
        matching retry returns the original 201 representation. The poll never
        closes.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question, options]
              properties:
                question:
                  type: string
                  minLength: 1
                options:
                  type: array
                  minItems: 2
                  maxItems: 6
                  items:
                    type: string
                    minLength: 1
      responses:
        '201':
          description: Poll created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /messages/{messageId}/vote:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    put:
      operationId: putMyPollVote
      summary: Vote for one option of a poll, or change the vote
      description: >-
        Any current member of the poll's non-archived table can vote, even
        when polls are off or their polls permission is disabled (those only
        stop new polls). Polls by authors the caller blocked are hidden and
        return 404. A matching retry returns 204 without reapplying.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [option]
              properties:
                option:
                  type: integer
                  minimum: 0
                  maximum: 5
                  description: Index into the poll's options.
      responses:
        '204':
          description: Vote recorded.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: removeMyPollVote
      summary: Remove the current user's vote
      description: Same access and retry rules as PUT. No request body is accepted.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Vote removed, or there was none.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /messages/{messageId}/reaction:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    put:
      operationId: putMyReaction
      summary: Set or replace the current user's reaction
      description: >-
        Dev accepts exactly one Unicode RGI emoji sequence as defined by
        ICU4J 76.1 (Emoji 16.0). The caller must be a current member of a
        non-archived table with react permission. Only visible text, GIF,
        poll and bet messages can be reacted to. Text and GIF messages from authors
        blocked by the caller are hidden; bet cards remain visible. Missing,
        inaccessible and non-reactable messages return the same 404. A matching
        retry returns 204 without reapplying, after rechecking current access;
        reusing the key for a different request returns 409.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [emoji]
              properties:
                emoji:
                  type: string
                  minLength: 1
                  description: Exactly one ICU4J 76.1 RGI emoji sequence.
      responses:
        '204':
          description: Reaction set.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: removeMyReaction
      summary: Remove the current user's reaction
      description: >-
        Dev removes only the caller's reaction, if present. The same access,
        visibility and retry rules as PUT apply. No request body is accepted.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Reaction removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tables/{tableId}/settle-points:
    parameters:
      - $ref: '#/components/parameters/TableId'
    post:
      operationId: settleTablePoints
      summary: Settle a table's resolved balances through the host
      description: >-
        Dev implementation. A matching retry requires current host
        authorization and returns the settlement with current receipt statuses.
        Creates a separate settlement with immutable payer, payee and amount
        identities. The server atomically settles eligible results, creates
        receipt lines, and posts a static chat summary. When eligible resolved
        non-4fun bets net to zero for everyone, a host can still settle them;
        the settlement links and marks those bets without zero-amount receipts.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Settlement created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /people/{userId}/settles:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listSettles
      summary: Settle history with one person
      description: >-
        Every settle between the caller and this person, newest first, 20 per
        page, including rejected ones (kept for audit). 404 when the two have
        no receipts.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: A page of settles.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Settle'
                  nextCursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createSettle
      summary: Settle chosen open receipts with one person
      description: >-
        Closes the chosen open receipts between the caller and this person at
        once. Points have no cash value: a settle only records that the two
        consider those receipts closed. The selection nets, from the
        caller's side, to points they're down (negative) or up. `sent`
        ("Settle" in the app): the person down settles; it counts as closed
        at once, the other person can reject it for 48 hours (which reopens
        the receipts), and the points limit keeps counting it until then.
        `received` ("Mark as settled"): the person up, or either side at a
        zero net, closes them; final at once. At most 3 sent settles between
        the two in any 24 hours (both directions, rejected ones
        included): 429 `settle_limit`. Other refusals are 409:
        `stale_selection` (a receipt isn't open any more),
        `invalid_settle` (wrong side for this kind),
        `settlement_review_required` (a balance change to review first). A
        matching retry returns the same settle.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, lineIds]
              properties:
                kind:
                  type: string
                  enum: [sent, received]
                lineIds:
                  type: array
                  minItems: 1
                  maxItems: 500
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        '201':
          description: The settle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /settles/{settleId}/reject:
    parameters:
      - name: settleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: rejectSettle
      summary: Reject a sent settle within its window
      description: >-
        Only the receiver of a `sent` settle, before `rejectBy`. Its receipts
        reopen; the settle stays in History as rejected. 409 `not_rejectable`
        once the window has passed or it was already rejected.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The rejected settle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /people/settle-groups:
    get:
      operationId: listSettlementGroups
      summary: Get the current user's settle-up groups
      description: >-
        Dev implementation.
        Everyone the caller has open receipts with, or a sent settle still
        inside its reject window (either direction). If any open group net
        exceeds the signed 64-bit range, the entire response fails with 409
        and code group_net_out_of_range. Groups with a nonzero net come
        first, newest activity first; groups at a zero net come last.
      responses:
        '200':
          description: Groups with their open receipts and net, the caller's pending review, and in-window settles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SettlementGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/{userId}/settlement-review:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getSettlementReview
      summary: Read the caller's balance-change warning for one person
      description: >-
        Dev implementation.
        Accessible only to a direct receipt party, including after all receipts
        close. A null revision means there is no unreviewed warning. This read
        is independent of group net size.
      responses:
        '200':
          description: The caller's current pending review, if any.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{userId}/settlement-review/acknowledge:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: acknowledgeSettlementReview
      summary: Acknowledge the caller's current balance-change warning
      description: >-
        Dev implementation.
        Acknowledges only the caller's warning at the supplied revision.
        A changed warning returns 409 with code stale_review; a matching retry
        never acknowledges a newer warning.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision:
                  type: string
                  format: uuid
      responses:
        '204':
          description: Warning acknowledged or the original acknowledgment replayed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tables/{tableId}/quick-picks:
    parameters:
      - $ref: '#/components/parameters/TableId'
    put:
      operationId: setQuickPicksEnabled
      summary: Enable or disable Quick Picks at a table
      description: >-
        Dev implementation; a current host can enable or disable Quick Picks.
        Enabling also enables sharing with the existing code. Disabling stops
        sharing, disconnects subscribers to this table, and
        removes this table's subscriptions to other sources. It does not
        remove existing copies or the table's persistent code. A matching
        retry rechecks host access without reapplying; actual changes write
        neutral system chat and internal outbox events, not deliveries.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '204':
          description: Quick Picks setting updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/relationships:
    get:
      operationId: getMyRelationships
      summary: Get the current user's social relationships
      description: >-
        Excludes follows across blocks in either direction and relationships to
        deleted users. blockedIds contains only the caller's own blocks, not
        accounts that have blocked the caller. Frozen users' existing
        relationships remain visible. Every list is newest first: following
        and followers by follow time, friends by when the second follow
        happened, blocks by block time.
      responses:
        '200':
          description: Following, followers, and the caller's private blocks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationships'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /follows/{userId}:
    description: >-
      Dev mutations accept no request body. Self-targets are invalid. Frozen
      users remain followable. Following is unavailable if either user has
      blocked the other, using the same 404 as an absent or deleted user.
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: followUser
      summary: Follow a user
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Following.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: unfollowUser
      summary: Stop following a user
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: No longer following.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /blocks/{userId}:
    description: >-
      Dev mutations accept no request body. Self-targets are invalid; frozen
      users can be blocked. Each user's block is independent, and unblocking
      does not restore follows or cancelled invitations.
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: blockUser
      summary: Block a user
      description: >-
        Blocking is private. It removes follows and cancels pending invitations
        in both directions. Follow attempts are blocked; future invitation
        services must also enforce the block. Chat filtering is not implemented.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Blocked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: unblockUser
      summary: Remove the caller's block
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Block removed; previous follows are not restored.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/invite-preferences:
    get:
      operationId: getMyInvitePreferences
      summary: Get the current user's table invitation preferences
      description: >-
        Defaults to friends open and following request when no preference row
        exists.
      responses:
        '200':
          description: Invitation preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: setMyInvitePreferences
      summary: Replace the current user's invitation preferences
      description: >-
        Updates the caller's policy and permanently cancels pending invitations
        that no longer qualify. A mutual follow uses friends; a one-way follow
        uses following. Both open and request permit accepting an existing
        request. Table creation and member additions create invitations.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitePreferences'
      responses:
        '204':
          description: Preferences updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/invites:
    get:
      operationId: listMyInvites
      summary: List the current user's pending table invitations
      description: >-
        Excludes invitations for archived tables, deleted senders, existing
        memberships, blocks, and invitations that no longer meet host, follow
        or current preference requirements, and requests older than 30 days
        (expired). Newest first; at most 100 can be waiting. A pending invite
        does not grant access to the full table. Frozen senders' qualifying
        invites remain.
      responses:
        '200':
          description: >-
            Pending invitations include the table name, emoji, a member
            preview and the member count needed for the request card, without
            granting access to the table's chat or bets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TableInvite'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tables/{tableId}/members/{userId}/bets:
    parameters:
      - $ref: '#/components/parameters/TableId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listMemberBets
      summary: Bets at a table that involve a member, newest first
      description: >-
        Ones they proposed and ones they joined once picks are public (after
        lock); the caller's own Active participation counts too. Same
        projection as listTableBets. For the profile popup.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tables/{tableId}/members/{userId}/record:
    parameters:
      - $ref: '#/components/parameters/TableId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getMemberRecord
      summary: A member's record at a table
      description: >-
        Resolved, non-4fun bets they had a pick in, how many they won and lost,
        and their net result in cents. Washed and 4fun bets don't count.
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /modes:
    get:
      operationId: listModes
      summary: Which bet modes accept proposals
      description: >-
        Every mode the product knows, and whether it can be proposed now. The
        client describes modes; the server decides availability (later per
        league data plan, ADR 0005). A table can still turn U2Pick off.
      responses:
        '200':
          description: The modes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModeAvailability'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /gifs:
    get:
      operationId: listGifs
      summary: The chat GIF library
      description: >-
        The curated library the GIF picker shows; sending a GIF accepts only
        these ids. Cacheable for an hour.
      responses:
        '200':
          description: Categories and GIFs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GifCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/gif-favorites:
    get:
      operationId: listGifFavorites
      summary: Your starred GIFs, newest first
      description: >-
        GIF ids from the library you've starred; the picker shows them in its
        Starred tab. Stars for GIFs no longer in the library are left out.
      responses:
        '200':
          description: Your stars.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [gifIds]
                properties:
                  gifIds:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/gif-favorites/{gifId}:
    parameters:
      - name: gifId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: starGif
      summary: Star a GIF
      description: >-
        Adds a library GIF to your stars (doing it again changes nothing). At
        most 100 stars: 409 favorites_full past that.
      responses:
        '204':
          description: Starred.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: unstarGif
      summary: Unstar a GIF
      responses:
        '204':
          description: Unstarred (or wasn't starred).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/chat/latest:
    get:
      operationId: listLatestChatMessages
      summary: The latest visible chat message at each of your current tables
      description: >-
        For the table cards on Home. One entry per current (not archived)
        table you belong to, in table id order. Visibility matches the chat
        window: deleted authors' and blocked authors' text and GIF messages
        are skipped, so the preview is the newest message you would see in
        that table's chat. Only text and system messages carry `text`
        (system text names host-event subjects as in the window); for GIF,
        bet and settlement messages the client describes the kind. Refetch
        when a table's chat feed reports a change.
      responses:
        '200':
          description: The previews.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /invites/{inviteId}/respond:
    parameters:
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: respondToInvite
      summary: Accept or decline the current user's invitation
      description: >-
        The sender must still be a host, the recipient must follow the sender,
        and the current friends or following preference must not be closed.
        Ineligible requests are permanently cancelled; once cancelled they
        cannot be declined. A request older than 30 days has expired and
        returns 409 like a cancelled one. Acceptance adds a member and a
        system chat message atomically; it returns 409 `table_limit` when the
        caller is at 100 tables and `table_full` when the table has 500
        members, and the request stays waiting. A matching retry returns 204
        only while current visibility and authorization still permit it.
        Requests are created by POST /tables/{tableId}/members, and the
        recipient's personal feed announces changes (`invitations.changed`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accept]
              properties:
                accept:
                  type: boolean
      responses:
        '204':
          description: Response recorded.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /reports:
    post:
      operationId: submitReport
      summary: Submit a report for the moderation queue
      description: >-
        Dev implementation. The target must be another player. tableId must be
        a non-archived table the caller is a member of; messageId requires
        tableId and must be a text or GIF message the target wrote there (its
        content is kept with the report). One open report per caller per
        target: reporting the same person again while your report is open
        updates it (reason and note, and the attached table and message when
        tableId is given) instead of adding another. At most 10 report calls
        an hour and 20 new reports per rolling day per caller (429).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetId, reason, note]
              properties:
                targetId:
                  type: string
                  format: uuid
                reason:
                  type: string
                  enum: [harassment, settlement, spam, offensive, other]
                note:
                  type: string
                  maxLength: 500
                  description: Required and nonblank for reason other.
                tableId:
                  type: string
                  format: uuid
                messageId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Report submitted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /feedback:
    post:
      operationId: submitFeedback
      summary: Submit guide feedback
      description: >-
        Stores feedback for the authenticated user. Text and an optional link
        are trimmed using JavaScript whitespace rules. NUL and unpaired
        surrogates are rejected because PostgreSQL cannot store them safely.
        At most 5 an hour per caller (429).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackSubmission'
      responses:
        '201':
          description: Feedback submitted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /users/{userId}/settlements:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getUserSettlementHistory
      summary: Read authorized settlement receipts for a user
      description: >-
        Dev implementation.
        Your receipts with this person, including archived-table history,
        optionally at one table. Every open (unpaid) receipt comes in full,
        newest first; closed ones (paid) come newest first, 20 at
        a time. Pass nextCursor to continue the closed list; that response's
        open list is empty. An unrelated or unknown user yields empty lists.
      parameters:
        - $ref: '#/components/parameters/OptionalTableId'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Settlement receipts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [open, closed, nextCursor]
                properties:
                  open:
                    type: array
                    items:
                      $ref: '#/components/schemas/SettlementLine'
                  closed:
                    type: array
                    maxItems: 20
                    items:
                      $ref: '#/components/schemas/SettlementLine'
                  nextCursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tables/{tableId}/last-read:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      operationId: getChatUnreadState
      summary: Read the current member's unread chat state
      description: >-
        Count only visible messages after the caller's read position, excluding
        their own messages. A member who has never opened the chat starts with
        all visible messages except their own unread, including system messages.
        Dev supports current members of non-archived tables only. Text and GIF
        messages from deleted authors or authors blocked by the caller are
        excluded; bet, system and settlement messages remain visible.
      responses:
        '200':
          description: The caller's filtered unread state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatUnreadState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: advanceChatReadPosition
      summary: Advance the current member's last-read chat position
      description: >-
        The requested message must be visible to the caller in this table.
        The position only moves forward, never backwards. It remains meaningful
        if a previously read message is later deleted. Matching retries recheck
        current access and target visibility, then return 204 without reapplying.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [messageId]
              properties:
                messageId:
                  type: string
                  format: uuid
      responses:
        '204':
          description: Position advanced or already beyond the requested message.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /ticker:
    get:
      operationId: getTicker
      summary: Get the sports-only ticker snapshot
      description: >-
        Dev implementation. Return games scheduled on the current America/New_York calendar date
        plus any live games scheduled on an earlier date. Include each game
        once, with live games first, then scheduled start and game ID ascending.
        No bet, participant, table or financial data is included. Clients
        perform presentation looping locally. An empty games array means no
        games in scope, not a substitute for unavailable feed data: unless every
        league was polled successfully within the freshness window (dev
        default three minutes) the response is 503 with code feed_unavailable.
      responses:
        '200':
          description: Sports ticker snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickerSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /games/{gameId}/players:
    get:
      operationId: listGamePlayers
      summary: A game's pickable players with current stats, for the player modes
      description: >-
        Both teams' active players plus anyone seen in the game's stats, by
        team then name, with each player's current canonical stats; and the
        league's stats in the order the proposal sheet offers them.
      parameters:
        - name: gameId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Players and stats.
          content:
            application/json:
              schema:
                type: object
                required: [stats, players]
                properties:
                  stats:
                    type: array
                    items:
                      type: object
                      required: [key, label]
                      properties:
                        key: {type: string}
                        label: {type: string}
                  players:
                    type: array
                    items:
                      type: object
                      required: [id, name, team, played, stats]
                      properties:
                        id: {type: string}
                        name: {type: string}
                        position: {type: [string, 'null']}
                        team: {type: [string, 'null']}
                        played: {type: boolean}
                        stats:
                          type: object
                          additionalProperties: {type: integer}
                        averages:
                          type: object
                          description: >-
                            This season's per-game averages by stat key, when
                            the provider has them (one decimal). Before
                            kickoff, when every stat is 0, they rank the
                            picker and suggest a line.
                          additionalProperties: {type: number}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /users:
    get:
      operationId: searchUsers
      summary: Find visible users by username
      description: >-
        Dev search trims ECMAScript whitespace, lowercases, and matches a literal
        username substring. It excludes the caller, deleted users and blocks
        in either direction; frozen users remain visible without their status.
        Pages contain at most 50 users in username order. Cursors represent a
        position rather than a snapshot, so renames or visibility changes may
        alter subsequent pages. Rate limiting is not yet implemented.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            description: After trimming and lowercasing, 1–15 ASCII letters, digits or underscores.
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of visible users.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  nextCursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getVisibleUser
      summary: Get a visible user or deleted-user placeholder
      description: >-
        Dev lookup includes the caller and frozen users without revealing status.
        A caller can resolve someone they blocked, even if the block is mutual.
        An incoming-only block hides the identity unless both users are current
        members of the same active table or are parties to the same receipt.
        Deleted identities return a placeholder only for shared current
        membership, an unexpired shared archive, a direct receipt, or an identity
        referenced by visible historical chat in an accessible table or archive.
        Other deleted, blocked and nonexistent identities return the same 404.
        Receipt history and account deletion are not yet implemented.
      responses:
        '200':
          description: The authorized public identity.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/User'
                  - $ref: '#/components/schemas/DeletedUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/delete:
    post:
      operationId: deleteMyAccount
      summary: Delete your own account
      description: >-
        Confirm by typing your own username (case and surrounding spaces
        don't matter). Blocked (409 account_not_square, with
        `blockers`) while you're in an Active or Pending bet, have unsettled
        table points, or have open receipts. Deletion removes personal data
        (profile, relationships, invite preferences, chat text and GIFs,
        reactions, read positions, feedback, debt cap, memberships and
        invitations, tomatoes) and turns the account into "Deleted user", which
        bets, the ledger and receipts keep referencing. Moderation records are
        kept. Tables you hosted pass to their earliest-joined active member, or
        are archived if nobody active is left. Ends every session and clears the
        session cookie and the player's sign-in code. Not idempotency-keyed:
        after success a retry can only fail authentication.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username]
              properties:
                username: {type: string}
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: That isn't your username (code `wrong_username`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Not square yet (code `account_not_square`).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, message, blockers]
                properties:
                  code: {type: string, const: account_not_square}
                  message: {type: string}
                  blockers:
                    type: array
                    items:
                      type: string
                      enum: [open_bets, unsettled_points, open_receipts]
  /admin/reports:
    get:
      operationId: listReports
      summary: The moderation queue
      description: >-
        Admin only. Reports newest first, 50 at a time, open ones unless
        status=all, with both people's current status and strikes and the
        reported message as it was when reported.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, all]
            default: open
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of reports.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/ModerationReport'
                  nextCursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/reports/{reportId}/dismiss:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: dismissReport
      summary: Dismiss an open report
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Dismissed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already handled (code `already_handled`) or a reused key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/reports/{reportId}/strike:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: strikeReport
      summary: Resolve a report with a strike against the reported player
      description: >-
        Strikes stop at three. Reaching three (again, after an unfreeze)
        freezes the account: its sessions end, sign-in reports it frozen, and
        tables it hosted pass to their earliest-joined active member (or are
        archived if nobody active is left). A replayed key returns 204.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The player's strikes now, and whether this strike froze them.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [strikes, frozen]
                properties:
                  strikes: {type: integer, minimum: 1, maximum: 3}
                  frozen: {type: boolean}
        '204':
          description: Replayed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already handled (code `already_handled`) or a reused key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users/flagged:
    get:
      operationId: listFlaggedUsers
      summary: Players with strikes or a frozen account
      description: Admin only. Frozen first, then most strikes, then by username, 50 at a time; `q` keeps usernames starting with it.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: q
          in: query
          required: false
          description: Username prefix, case-insensitive, up to 15 characters.
          schema: {type: string, maxLength: 15}
      responses:
        '200':
          description: A page of people.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/ModerationPerson'
                  nextCursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/players:
    get:
      operationId: listPlayers
      summary: Player accounts, newest first
      description: >-
        Admin only, 50 at a time. Each player's last sign-in, when their
        sign-in code was last issued (GET /admin/players/{playerId}/code
        shows the code), their strikes and open reports against them. `q`
        keeps usernames starting with it.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 15
      responses:
        '200':
          description: A page of players.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  nextCursor:
                    type: [string, 'null']
                  items:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      required: [id, username, hue, status, lastSignInAt, codeRotatedAt, createdAt, strikes, openReports]
                      properties:
                        id:
                          type: string
                          format: uuid
                        username:
                          type: string
                        hue:
                          type: integer
                          minimum: 1
                          maximum: 5
                        status:
                          type: string
                          enum: [ACTIVE, FROZEN]
                        lastSignInAt:
                          type: [string, 'null']
                          format: date-time
                        codeRotatedAt:
                          type: [string, 'null']
                          format: date-time
                          description: When the sign-in code was last issued (the code itself is never listed).
                        createdAt:
                          type: string
                          format: date-time
                        strikes:
                          type: integer
                          minimum: 0
                          maximum: 3
                        openReports:
                          type: integer
                          minimum: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createPlayer
      summary: Create a player account and its sign-in code
      description: >-
        There's no registration: the admin creates each account. The
        username is trimmed and lowercased. The response carries the
        player's sign-in code (also readable later with GET
        /admin/players/{playerId}/code). No retry key: a retry finds the
        username taken.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username]
              properties:
                username:
                  type: string
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, username, code]
                properties:
                  id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  code:
                    $ref: '#/components/schemas/SignInCode/properties/code'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The username is taken (code `username_taken`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/players/{playerId}/code:
    parameters:
      - name: playerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPlayerCode
      summary: A player's sign-in code
      description: >-
        Admin only. The code the player signs in with, for the admin's QR
        card (the player opens /signin#<code>). Stored encrypted; readable
        again until it's rotated.
      responses:
        '200':
          description: The code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInCode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: rotatePlayerCode
      summary: Rotate a player's sign-in code
      description: >-
        Admin only. Issues a new code and ends every session of the player,
        so the old code and every signed-in device stop working.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: The new code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInCode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/players/{playerId}:
    parameters:
      - name: playerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deletePlayer
      summary: Delete a player outright
      description: >-
        Admin only, in every mode. Unlike a player deleting themselves, the
        player needn't be square: every Active or Pending bet they proposed
        or picked in, at a current table, washes for everyone ("A player's
        account was deleted", posted in that table's chat; Active bets lock
        first). Then their account is deleted the same way (personal data
        removed, memberships ended with host recovery, sessions revoked) and
        their username becomes free. Points already won or lost, settle-ups
        and receipts stay, under "Deleted user".
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Deleted; how many open bets washed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [washedBets]
                properties:
                  washedBets:
                    type: integer
                    minimum: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/lan/party:
    get:
      operationId: getLanParty
      summary: The LAN party table
      description: >-
        Admin only, and only on the LAN (404 elsewhere). The table the first
        player created hosts, which every later player is seated at; null
        before the first player. `deleted` is true once its host deleted it,
        after which new players get no table.
      responses:
        '200':
          description: The party table, or null.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [table]
                properties:
                  table:
                    oneOf:
                      - type: 'null'
                      - type: object
                        additionalProperties: false
                        required: [id, name, emoji, deleted, hostIds, memberIds]
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                          emoji:
                            type: string
                          deleted:
                            type: boolean
                          hostIds:
                            type: array
                            items:
                              type: string
                              format: uuid
                          memberIds:
                            type: array
                            items:
                              type: string
                              format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users/{userId}/unfreeze:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: unfreezeUser
      summary: Let a frozen player sign in again
      description: Restores sign-in only; strikes and hosting are unchanged.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Unfrozen.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not frozen (code `already_handled`) or a reused key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users/{userId}/clear-strikes:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: clearStrikes
      summary: Reset a player's strikes to zero
      description: Doesn't unfreeze a frozen account.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /dev/sports:
    get:
      operationId: listDevSports
      summary: Dev sports data sources (dev profile only)
      description: >-
        Registered only when PVPICKS_DEV_SPORTS_DIR is set; 404 otherwise.
        Lists scenario files and recorded chunks with what's running. Running
        sources feed DEV- games through the real game and stats sync. See
        docs/site/dev-sports-data.md.
      responses:
        '200':
          description: Sources.
          content:
            application/json:
              schema:
                type: object
                required: [speeds, scenarios, chunks]
                properties:
                  speeds:
                    type: array
                    items: {type: number}
                  scenarios:
                    type: array
                    items:
                      $ref: '#/components/schemas/DevSource'
                  chunks:
                    type: array
                    items:
                      $ref: '#/components/schemas/DevSource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /dev/sports/{kind}/{name}/{action}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: {type: string, enum: [scenarios, chunks]}
      - name: name
        in: path
        required: true
        schema: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,40}$'}
      - name: action
        in: path
        required: true
        schema: {type: string, enum: [start, stop, pause, resume, speed]}
    post:
      operationId: controlDevSource
      summary: Start (or restart), stop, pause, resume, or set a chunk's speed
      description: >-
        Dev profile only. pause, resume and speed apply to chunks; speed takes
        {"speed": n} with n one of the listed speeds.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                speed: {type: number}
      responses:
        '204':
          description: Done.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /dev/demo:
    get:
      operationId: getDemoWorld
      summary: The demo world's size (dev demo only)
      description: >-
        Registered only when the dev demo is on (the dev profile); 404
        otherwise. The Dev page shows its Reset section when this answers. See
        docs/site/demo-data.md.
      responses:
        '200':
          description: Counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoWorld'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /dev/demo/reset:
    post:
      operationId: resetDemoWorld
      summary: Wipe app data and reseed the demo world (dev demo only)
      description: >-
        Wipes every app table except sports data (games, players, stats, feed
        status) and the migration history, then reseeds the demo world. Every
        session ends, the caller's included: the response clears the session
        cookie and rotates the CSRF token.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: The reseeded world's counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoWorld'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /dev/demo/accounts:
    get:
      operationId: listDemoAccounts
      summary: Accounts for the demo's sign-in picker (dev demo only)
      description: >-
        No authentication. The main accounts (newbie, intermediate, pro,
        admin) in that order, then up to 20 other accounts whose username
        starts with q.
      security: []
      parameters:
        - name: q
          in: query
          required: false
          schema: {type: string, pattern: '^[A-Za-z0-9_]{0,15}$'}
      responses:
        '200':
          description: Accounts.
          content:
            application/json:
              schema:
                type: object
                required: [main, others]
                properties:
                  main:
                    type: array
                    items:
                      $ref: '#/components/schemas/DemoAccount'
                  others:
                    type: array
                    items:
                      $ref: '#/components/schemas/DemoAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /dev/demo/sign-in:
    post:
      operationId: signInToDemoAccount
      summary: Sign in as any account without a password (dev demo only)
      description: >-
        Same session cookie and CSRF rotation as /auth/login, replacing the
        caller's session. Frozen accounts get 403 account_frozen.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: {type: string, format: uuid}
      responses:
        '204':
          description: Signed in.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/health:
    get:
      operationId: getAdminHealth
      summary: Get the dev admin dependency health snapshot
      description: >-
        Active administrators only. Reports PostgreSQL and Redis indicator
        statuses without connection details. Kafka is explicitly NOT_CHECKED;
        this is not an overall application status or a latency/error metrics
        feed. A failed dependency can be reported in a successful snapshot.
        Authentication and admin authorization require PostgreSQL, so this
        endpoint may be unavailable when PostgreSQL is down.
      responses:
        '200':
          description: A non-cacheable dependency snapshot.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHealthSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Health snapshot could not be collected.
  /admin/users/{userId}/audit:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getUserAudit
      summary: Everything an admin sees about one player
      description: >-
        Admin only. Account, moderation (read-only), people counts, current
        tables, betting record, settle-ups, the last 30 New York days of
        activity (who audited them is GET /admin/audit-log?subject=). Picks and
        participation on bets still Active are left out of every count until
        the bet locks. Opening an audit is recorded in the
        admin audit log (once per admin and player per 10 minutes).
      responses:
        '200':
          description: The audit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAudit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/users/{userId}/activity:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listUserActivity
      summary: What a player wrote, newest first
      description: >-
        Admin only, 30 at a time. Chat messages and GIFs, polls and the bets
        they proposed, optionally one kind and only items containing `q`
        (case-insensitive; text, poll options, bet question and choices). A
        search (`q` without a cursor) is recorded in the admin audit log.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [message, poll, bet]
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: A page of items.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    maxItems: 30
                    items:
                      $ref: '#/components/schemas/ActivityItem'
                  nextCursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/audit-log:
    get:
      operationId: listAdminAuditLog
      summary: Which admin audited whom, newest first
      description: Admin only, 50 at a time. With `subject`, only that player's entries (their audit's "Audited by" list).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: subject
          in: query
          required: false
          description: Only entries about this player.
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: A page of entries.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/AdminLogEntry'
                  nextCursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/sign-in-lockout:
    get:
      operationId: getSignInLockouts
      summary: Players with wrong sign-in codes, and the address backstop
      description: >-
        Admin only. Every player with wrong codes in the current window
        (locked first), and the busiest address counter. Behind Docker
        Desktop every phone shares one address, so on the LAN that counter
        is the whole party's.
      responses:
        '200':
          description: The lockouts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInLockouts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: clearSignInLockouts
      summary: Clear every wrong-code counter (players, unknown names, addresses)
      description: Admin only. Idempotent.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/sign-in-lockout/players/{playerId}:
    delete:
      operationId: clearPlayerSignInLockout
      summary: Clear one player's wrong codes, so they can sign in at once
      description: Admin only. Idempotent.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: playerId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204':
          description: Cleared.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/feedback:
    get:
      operationId: listFeedback
      summary: Player feedback, newest first
      description: Admin only, 50 at a time, with how many are New and Done overall.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [new, done, all]
            default: new
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [mode, perk, gif, bug, other]
      responses:
        '200':
          description: A page of feedback.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor, counts]
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/FeedbackItem'
                  nextCursor:
                    type: [string, 'null']
                  counts:
                    type: object
                    additionalProperties: false
                    required: [open, done]
                    properties:
                      open:
                        type: integer
                      done:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/feedback/{feedbackId}:
    parameters:
      - name: feedbackId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateFeedback
      summary: Mark feedback Done or New, with a private note
      description: >-
        Admin only. Idempotent. Done records the admin and time (kept if it
        was already Done); New clears them.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  enum: [NEW, DONE]
                note:
                  type: [string, 'null']
                  maxLength: 500
      responses:
        '204':
          description: Saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /perf:
    post:
      operationId: reportPerf
      summary: Report browser timings
      description: >-
        Any signed-in account; 10 calls a minute. Up to 100 samples: `api`
        (an API call's method, path and status as the browser saw it,
        filed under the server route the path matches; unknown paths are
        dropped; status 0 means no response), `page` (a full page load) and
        `lcp` (largest contentful paint), the last two under an app route
        such as `/tables/$tableId`. Invalid samples are skipped.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [samples]
              properties:
                samples:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [kind, path, ms]
                    properties:
                      kind:
                        type: string
                        enum: [api, page, lcp]
                      method:
                        type: string
                      path:
                        type: string
                      status:
                        type: integer
                      ms:
                        type: integer
                        minimum: 0
      responses:
        '204':
          description: Recorded.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admin/perf:
    get:
      operationId: getPerf
      summary: Request performance over a window
      description: >-
        Admin only. From the stored minutes (kept 7 days; the current minute
        is still filling): totals, one chart point per step (1h: 1 minute,
        6h: 5 minutes, 24h: 15 minutes, 7d: 1 hour) and every route busiest
        first. Percentiles are estimated from latency buckets. With
        `method` and `route`, totals and chart cover only that route.
      parameters:
        - name: window
          in: query
          required: false
          schema:
            type: string
            enum: [1h, 6h, 24h, 7d]
            default: 1h
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [server, client]
            default: server
        - name: method
          in: query
          required: false
          schema:
            type: string
        - name: route
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/perf/live:
    get:
      operationId: getPerfLive
      summary: Live runtime gauges
      description: >-
        Admin only. This server instance: uptime, version, database pool,
        JVM memory, threads and CPU, the outbox backlog and the sports feed
        status per league.
      responses:
        '200':
          description: The gauges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfLive'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/sports/leagues:
    get:
      operationId: listSportsLeagues
      summary: Leagues with game counts and feed status
      responses:
        '200':
          description: Both leagues.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SportsLeague'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/sports/days:
    get:
      operationId: listSportsDays
      summary: New York dates that have games, newest first
      description: Admin only, the latest 400 days.
      parameters:
        - name: league
          in: query
          required: true
          schema:
            type: string
            enum: [NBA, NFL]
      responses:
        '200':
          description: Days.
          content:
            application/json:
              schema:
                type: array
                maxItems: 400
                items:
                  $ref: '#/components/schemas/SportsDay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/sports/games:
    get:
      operationId: listSportsGames
      summary: A league's games on a New York date, by start time
      parameters:
        - name: league
          in: query
          required: true
          schema:
            type: string
            enum: [NBA, NFL]
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Games.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SportsGame'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/sports/games/{gameId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      operationId: getSportsGame
      summary: One game in full
      description: >-
        Admin only. The latest state with per-period scores, every player's
        current stats (as stored, by stat key) and bets on the game by mode
        and status.
      responses:
        '200':
          description: The game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SportsGameDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/sports/games/{gameId}/snapshots:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      operationId: listGameSnapshots
      summary: A game's snapshots, oldest first
      description: Admin only. One per change the poller saw, the latest 5000.
      responses:
        '200':
          description: Snapshots.
          content:
            application/json:
              schema:
                type: array
                maxItems: 5000
                items:
                  $ref: '#/components/schemas/GameSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/sports/games/{gameId}/players/{playerId}/snapshots:
    parameters:
      - $ref: '#/components/parameters/GameId'
      - name: playerId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listPlayerStatSnapshots
      summary: One player's stat snapshots in a game, oldest first
      description: Admin only, the latest 5000.
      responses:
        '200':
          description: Snapshots.
          content:
            application/json:
              schema:
                type: array
                maxItems: 5000
                items:
                  type: object
                  additionalProperties: false
                  required: [observedAt, played, stats]
                  properties:
                    observedAt:
                      type: string
                      format: date-time
                    played:
                      type: boolean
                    stats:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: >-
        Dev JWT in the host-only HttpOnly session cookie, with Path=/ and
        SameSite=Strict. Local HTTP cannot use Secure; LAN and production
        require TLS and Secure cookies and remain unavailable. Dev sessions
        expire after eight hours without refresh. Each authenticated request
        checks the JWT and its server-side session and account status.
        Logout revokes the current session immediately; frozen or deleted
        accounts and revoked or expired sessions cannot authenticate. Session
        state is authoritative in PostgreSQL, not Redis.
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: Token returned by GET /auth/csrf for the current CSRF cookie.
      schema:
        type: string
        minLength: 1
    TableId:
      name: tableId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BetId:
      name: betId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OptionalTableId:
      name: tableId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    GameId:
      name: gameId
      in: path
      required: true
      schema:
        type: string
        pattern: '^(NBA|NFL)-[A-Za-z0-9_-]+$'
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor from the preceding response.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        A client-generated key reused only to retry the same operation. The
        draft guarantee is 24 hours after commit, scoped to the authenticated
        user across operations. A different operation, target or payload with
        the same key returns 409. Concurrent matching requests must not apply
        the effect twice. Authentication, current authorization and visibility
        are rechecked before a recorded outcome is returned; after the window,
        reconcile state rather than retrying blindly. The dev invite preferences PUT, debt-cap PUT,
        feedback POST, invitation response POST and follow/block POST/DELETE
        implement this protection,
        with bodyless 201 or 204 outcomes and no pruning. Other operations
        remain drafts.
        Retention, key rotation and replay of other response shapes need review.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  schemas:
    SignInCodeValue:
      type: string
      pattern: '^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{4}$'
      description: A player's sign-in code; the QR link is /signin#<code>.
    SignInCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/SignInCodeValue'
    SignInCodeCounter:
      type: object
      additionalProperties: false
      required: [wrongCodes, locked, resetsAt]
      properties:
        wrongCodes: {type: integer, minimum: 0}
        locked: {type: boolean, description: True once wrongCodes reaches the limit; even right codes are refused until it resets or is cleared.}
        resetsAt: {type: [string, 'null'], format: date-time}
    SignInLockouts:
      type: object
      additionalProperties: false
      required: [playerLimit, addressLimit, address, players]
      properties:
        playerLimit: {type: integer, minimum: 1}
        addressLimit: {type: integer, minimum: 1}
        address:
          $ref: '#/components/schemas/SignInCodeCounter'
        players:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, username, hue, wrongCodes, locked, resetsAt]
            properties:
              id: {type: string, format: uuid}
              username: {type: [string, 'null']}
              hue: {type: [integer, 'null'], minimum: 1, maximum: 5}
              wrongCodes: {type: integer, minimum: 1}
              locked: {type: boolean}
              resetsAt: {type: [string, 'null'], format: date-time}
    AdminHealthSnapshot:
      type: object
      additionalProperties: false
      required: [checkedAt, postgres, redis, kafka]
      properties:
        checkedAt:
          type: string
          format: date-time
        postgres:
          $ref: '#/components/schemas/DependencyCheckStatus'
        redis:
          $ref: '#/components/schemas/DependencyCheckStatus'
        kafka:
          const: NOT_CHECKED
    DependencyCheckStatus:
      type: string
      enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
    FeedbackSubmission:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [mode, perk, gif, bug, other]
        text:
          type: string
          description: Trim surrounding whitespace, then require 10 to 1000 UTF-16 code units.
        link:
          type: string
          pattern: '^(\s*|\s*[hH][tT][tT][pP][sS]?://\S+\s*)$'
          description: >-
            Trim surrounding whitespace; an empty result means no link.
            Otherwise require an HTTP(S) link with no whitespace.
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
    TickerSnapshot:
      type: object
      additionalProperties: false
      required: [games]
      properties:
        games:
          type: array
          description: Unique games in ticker order.
          items:
            $ref: '#/components/schemas/TickerGame'
    TickerGame:
      type: object
      additionalProperties: false
      required: [id, league, status, startsAt, home, away, observedAt, dev]
      properties:
        dev:
          type: boolean
          description: >-
            A dev data game (a dev scenario or recorded chunk, dev profile
            only), not a real one. Dev games show even when the real feed is
            stale.
        id:
          type: string
          minLength: 1
        league:
          type: string
          enum: [NBA, NFL]
        status:
          type: string
          enum: [SCHEDULED, LIVE, FINAL, POSTPONED]
        startsAt:
          type: string
          format: date-time
        period:
          type: [integer, 'null']
          minimum: 1
        clock:
          type: [string, 'null']
        home:
          $ref: '#/components/schemas/TickerTeam'
        away:
          $ref: '#/components/schemas/TickerTeam'
        observedAt:
          type: string
          format: date-time
    TickerTeam:
      type: object
      additionalProperties: false
      required: [abbreviation, score]
      properties:
        abbreviation:
          type: string
          minLength: 1
        score:
          type: [integer, 'null']
          minimum: 0
    GameTeam:
      type: object
      additionalProperties: false
      required: [abbreviation, name, city, score, players]
      properties:
        abbreviation:
          type: string
        name:
          type: string
        city:
          type: string
        score:
          type: [integer, 'null']
        players:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, position]
            properties:
              id:
                type: string
              name:
                type: string
              position:
                type: string
    UuidList:
      type: array
      uniqueItems: true
      items:
        type: string
        format: uuid
    Relationships:
      type: object
      additionalProperties: false
      required: [followingIds, followerIds, friendIds, blockedIds]
      description: Every list is newest first.
      properties:
        followingIds:
          $ref: '#/components/schemas/UuidList'
        followerIds:
          $ref: '#/components/schemas/UuidList'
        friendIds:
          $ref: '#/components/schemas/UuidList'
          description: Mutual follows, newest friendship first (when the second follow happened).
        blockedIds:
          $ref: '#/components/schemas/UuidList'
    InvitePreferences:
      type: object
      additionalProperties: false
      required: [friends, following]
      properties:
        friends:
          type: string
          enum: [open, request, closed]
        following:
          type: string
          enum: [open, request, closed]
    TableInvite:
      type: object
      additionalProperties: false
      required: [id, tableId, tableName, tableEmoji, fromId, userId, createdAt, memberPreview, memberCount]
      properties:
        id:
          type: string
          format: uuid
        tableId:
          type: string
          format: uuid
        tableName:
          type: string
        tableEmoji:
          type: string
        fromId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        memberPreview:
          type: array
          maxItems: 4
          description: >-
            Up to four of the table's members in join order, for avatars on
            the request card. Leaves out deleted accounts and members who
            block the invitee, so every listed profile is readable.
          items:
            type: string
            format: uuid
        memberCount:
          type: integer
          minimum: 1
          maximum: 500
          description: Everyone at the table, including members the preview leaves out.
    Settlement:
      type: object
      additionalProperties: false
      required: [id, tableId, hostId, createdAt, lines]
      properties:
        id:
          type: string
          format: uuid
        tableId:
          type: string
          format: uuid
        hostId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SettlementLine'
    SettlementLine:
      type: object
      additionalProperties: false
      required: [id, settlementId, tableId, payerId, payeeId, amountCents, status, revision, settleId, createdAt, updatedAt]
      description: >-
        A receipt: one table's points settlement between two people. Unpaid
        until a settle closes it.
      properties:
        id:
          type: string
          format: uuid
        settlementId:
          type: string
          format: uuid
        tableId:
          type: string
          format: uuid
        payerId:
          type: string
          format: uuid
        payeeId:
          type: string
          format: uuid
        amountCents:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [unpaid, paid]
        revision:
          type: integer
          minimum: 0
        settleId:
          type: [string, 'null']
          format: uuid
          description: The settle that closed it; null while unpaid.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Settle:
      type: object
      additionalProperties: false
      required: [id, kind, senderId, otherId, payerId, payeeId, amountCents, createdAt, rejectBy, rejectedAt, canReject, lines]
      description: One action that closed a set of a pair's receipts.
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [sent, received]
        senderId:
          type: string
          format: uuid
          description: Who settled.
        otherId:
          type: string
          format: uuid
        payerId:
          type: [string, 'null']
          format: uuid
          description: Who pays the selection's net; null when it netted to zero.
        payeeId:
          type: [string, 'null']
          format: uuid
        amountCents:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        rejectBy:
          type: [string, 'null']
          format: date-time
          description: Sent settles only; the receiver can reject until then.
        rejectedAt:
          type: [string, 'null']
          format: date-time
        canReject:
          type: boolean
          description: Whether the caller can reject it now.
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, tableId, payerId, payeeId, amountCents, createdAt]
            properties:
              id:
                type: string
                format: uuid
              tableId:
                type: string
                format: uuid
              payerId:
                type: string
                format: uuid
              payeeId:
                type: string
                format: uuid
              amountCents:
                type: integer
                minimum: 1
              createdAt:
                type: string
                format: date-time
    BetPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Bet'
        nextCursor:
          type: [string, 'null']
    TomatoThrow:
      type: object
      additionalProperties: false
      required: [id, throwerId, targetId, thrownAt]
      properties:
        id:
          type: string
          format: uuid
        throwerId:
          type: string
          format: uuid
        targetId:
          type: string
          format: uuid
        thrownAt:
          type: string
          format: date-time
    TableBalance:
      type: object
      additionalProperties: false
      required: [userId, balanceCents, unsettledCents]
      properties:
        userId:
          type: string
          format: uuid
        balanceCents:
          type: integer
          format: int64
        unsettledCents:
          type: integer
          format: int64
    MemberBalance:
      type: object
      additionalProperties: false
      required: [userId, balanceCents, unsettledCents, tickets]
      properties:
        userId:
          type: string
          format: uuid
        balanceCents:
          type: integer
          format: int64
        unsettledCents:
          type: integer
          format: int64
        tickets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [betId, mode, question, loseCents, winCents]
            properties:
              betId:
                type: string
                format: uuid
              mode:
                type: string
              question:
                type: string
              choice:
                type: string
                description: The member's pick; absent for a Jackblack game.
              loseCents:
                type: integer
                format: int64
                maximum: 0
              winCents:
                type: integer
                format: int64
                minimum: 0
    SettlementGroup:
      type: object
      additionalProperties: false
      required: [otherUserId, netCents, lines, pendingReviewRevision, pendingSettles]
      properties:
        otherUserId:
          type: string
          format: uuid
        netCents:
          type: integer
          format: int64
          description: Of the open receipts. Positive means the caller is owed points; negative means the caller owes.
        pendingReviewRevision:
          type: [string, 'null']
          format: uuid
          description: The caller's unreviewed balance-change warning; settling waits until it's reviewed.
        lines:
          type: array
          description: The open receipts.
          items:
            $ref: '#/components/schemas/SettlementLine'
        pendingSettles:
          type: array
          description: Sent settles between the two still inside their reject window, newest first.
          items:
            $ref: '#/components/schemas/Settle'
    SettlementReview:
      type: object
      additionalProperties: false
      required: [pendingReviewRevision]
      properties:
        pendingReviewRevision:
          type: [string, 'null']
          format: uuid
          description: The caller's current unreviewed warning, or null.
    ChatUnreadState:
      type: object
      additionalProperties: false
      required: [firstUnreadMessageId, unreadCount]
      properties:
        firstUnreadMessageId:
          type: [string, 'null']
          format: uuid
        unreadCount:
          type: integer
          minimum: 0
      allOf:
        - if:
            properties:
              unreadCount:
                const: 0
            required: [unreadCount]
          then:
            properties:
              firstUnreadMessageId:
                type: 'null'
          else:
            properties:
              firstUnreadMessageId:
                type: string
                format: uuid
    ChatPreview:
      type: object
      additionalProperties: false
      required: [tableId, message]
      properties:
        tableId:
          type: string
          format: uuid
        message:
          description: The newest visible message, or null when the table has none.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ChatPreviewMessage'
    ChatPreviewMessage:
      type: object
      additionalProperties: false
      required: [id, kind, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [text, gif, bet, system, settlement, poll]
        createdAt:
          type: string
          format: date-time
        authorId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
    MemberRecord:
      type: object
      additionalProperties: false
      required: [played, won, lost, netCents]
      properties:
        played: {type: integer, minimum: 0}
        won: {type: integer, minimum: 0}
        lost: {type: integer, minimum: 0}
        netCents: {type: integer}
    ModeAvailability:
      type: object
      additionalProperties: false
      required: [id, available]
      properties:
        id:
          $ref: '#/components/schemas/BetMode'
        available:
          type: boolean
    GifCatalog:
      type: object
      additionalProperties: false
      required: [categories, gifs]
      properties:
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, label]
            properties:
              id: {type: string, minLength: 1}
              label: {type: string, minLength: 1}
        gifs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, url, alt, category, tags]
            properties:
              id: {type: string, minLength: 1}
              url: {type: string, format: uri}
              alt: {type: string, minLength: 1}
              category: {type: string, minLength: 1}
              tags:
                type: array
                items: {type: string}
    ChatMessage:
      type: object
      additionalProperties: false
      required: [id, tableId, kind, createdAt]
      properties:
        bet:
          type: object
          additionalProperties: false
          required: [question, modeId, status]
          description: For bet messages, what the card shows without loading the bet.
          properties:
            question: {type: string}
            modeId: {type: string}
            status:
              type: string
              enum: [ACTIVE, PENDING, SETTLED, WASHED]
        id:
          type: string
          format: uuid
        tableId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [text, gif, bet, system, settlement, poll]
        createdAt:
          type: string
          format: date-time
        authorId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
        gifId:
          type: string
          minLength: 1
        betId:
          type: string
          format: uuid
        settlementId:
          type: string
          format: uuid
        settlementSummary:
          $ref: '#/components/schemas/ChatSettlementSummary'
        poll:
          $ref: '#/components/schemas/ChatPoll'
        reactions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [userId, emoji]
            properties:
              userId:
                type: string
                format: uuid
              emoji:
                type: string
      oneOf:
        - required: [authorId, text]
          properties:
            kind: { const: text }
            authorId: true
            text: true
            gifId: false
            betId: false
            settlementId: false
            settlementSummary: false
            poll: false
        - required: [authorId, gifId]
          properties:
            kind: { const: gif }
            authorId: true
            gifId: true
            text: false
            betId: false
            settlementId: false
            settlementSummary: false
            poll: false
        - required: [authorId, betId]
          properties:
            kind: { const: bet }
            authorId: true
            betId: true
            text: false
            gifId: false
            settlementId: false
            settlementSummary: false
            poll: false
        - required: [text]
          properties:
            kind: { const: system }
            text: true
            authorId: false
            gifId: false
            betId: false
            settlementId: false
            settlementSummary: false
            poll: false
        - required: [settlementId, settlementSummary]
          properties:
            kind: { const: settlement }
            settlementId: true
            settlementSummary: true
            authorId: false
            text: false
            gifId: false
            betId: false
            poll: false
        - required: [authorId, text, poll]
          description: A poll; its question is the text.
          properties:
            kind: { const: poll }
            authorId: true
            text: true
            poll: true
            gifId: false
            betId: false
            settlementId: false
            settlementSummary: false
    ChatPoll:
      type: object
      additionalProperties: false
      required: [options, votes]
      description: >-
        A poll's options and every vote from a non-deleted member, oldest
        first. Votes are visible to everyone at the table; polls never close.
      properties:
        options:
          type: array
          minItems: 2
          maxItems: 6
          items:
            type: string
            minLength: 1
        votes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [userId, option]
            properties:
              userId:
                type: string
                format: uuid
              option:
                type: integer
                minimum: 0
                maximum: 5
                description: Index into options.
    ChatSettlementSummary:
      type: object
      additionalProperties: false
      description: >-
        Static amounts and parties from the original settlement, not current
        receipt statuses or live balances.
      required: [hostId, lines]
      properties:
        hostId:
          type: string
          format: uuid
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [payerId, payeeId, amountCents]
            properties:
              payerId:
                type: string
                format: uuid
              payeeId:
                type: string
                format: uuid
              amountCents:
                type: integer
                format: int64
                minimum: 1
    TableArchive:
      type: object
      additionalProperties: false
      required: [id, name, emoji, archivedAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        emoji:
          type: string
        archivedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    QuickPickCode:
      type: string
      pattern: '^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{6}$'
    MemberRequestOutcome:
      type: object
      additionalProperties: false
      required: [userId, outcome]
      properties:
        userId:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [added, invited, not_added]
    TableCreationResult:
      type: object
      additionalProperties: false
      required: [table, outcomes]
      properties:
        table:
          $ref: '#/components/schemas/Table'
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/MemberRequestOutcome'
    BetLiveStats:
      type: object
      additionalProperties: false
      required: [gameId, league, status, period, clock, away, home, rows, closed]
      properties:
        closed:
          type: boolean
          description: >-
            The bet is resolved or washed: current, the score, status, period
            and clock are as they were when it was called, and stop changing.
        gameId:
          type: string
        league:
          type: string
          enum: [NBA, NFL]
        status:
          type: string
        period:
          type: [integer, 'null']
        clock:
          type: [string, 'null']
        away:
          $ref: '#/components/schemas/LiveTeam'
        home:
          $ref: '#/components/schemas/LiveTeam'
        rows:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [label, detail, proposed, locked, current, target, targetLabel]
            properties:
              label:
                type: string
                description: e.g. "Drake Maye passing yards" or "Combined score".
              detail:
                type: [string, 'null']
                description: e.g. the player's position and team.
              proposed:
                type: [integer, 'null']
                description: When the bet was proposed; null for bets made before snapshots.
              locked:
                type: [integer, 'null']
                description: When picks locked; null before lock.
              current:
                type: [integer, 'null']
                description: Now, or once the bet is closed, when it was called.
              target:
                type: [number, 'null']
                description: The line or target this number is measured against, if the mode has one.
              targetLabel:
                type: [string, 'null']
    LiveTeam:
      type: object
      additionalProperties: false
      required: [abbreviation, score]
      properties:
        abbreviation:
          type: string
        score:
          type: [integer, 'null']
    TableSummary:
      type: object
      additionalProperties: false
      description: One of the caller's tables in a list. Never the whole member list.
      required: [id, name, emoji, host, memberCount, memberPreview, myDisabledPermissions, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        emoji:
          type: string
        host:
          type: boolean
          description: Whether the caller hosts this table.
        memberCount:
          type: integer
          minimum: 1
          maximum: 500
        memberPreview:
          type: array
          maxItems: 4
          description: The first members by join order, for avatars.
          items:
            type: string
            format: uuid
        myDisabledPermissions:
          type: array
          description: The caller's own permissions a host turned off here.
          items:
            type: string
            enum: [bets, text, react, gifs, polls]
        lastBetAt:
          type: string
          format: date-time
          description: When the table's most recent bet was proposed. Absent before its first bet.
        joinedAt:
          type: string
          format: date-time
          description: When the caller joined. The list orders by the later of this and lastBetAt.
    Table:
      type: object
      additionalProperties: false
      required: [id, name, emoji, memberIds, hostIds, hostsOnlyBets, u2pickEnabled, pollsEnabled, jackblackAccess, holdemAccess, quickPicksEnabled, quickPickSharing, disabledPermissions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 14
        emoji:
          type: string
        memberIds:
          type: array
          items:
            type: string
            format: uuid
        hostIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        hostsOnlyBets:
          type: boolean
        u2pickEnabled:
          type: boolean
        pollsEnabled:
          type: boolean
          description: Whether members can start new chat polls.
        jackblackAccess:
          $ref: '#/components/schemas/JackblackAccess'
        holdemAccess:
          $ref: '#/components/schemas/HoldemAccess'
        quickPickCode:
          description: Present only for current table hosts.
          $ref: '#/components/schemas/QuickPickCode'
        quickPicksEnabled:
          type: boolean
        quickPickSharing:
          type: boolean
        subscribedTo:
          description: Source tables this table copies Quick Picks from. Present only for current table hosts.
          type: array
          items:
            type: string
            format: uuid
        disabledPermissions:
          type: object
          description: Per-member permissions disabled by a host; non-hosts see only their own.
          additionalProperties:
            type: array
            uniqueItems: true
            items:
              type: string
              enum: [bets, text, react, gifs, polls]
    DebtCap:
      type: object
      additionalProperties: false
      required: [capCents]
      properties:
        capCents:
          type: [integer, 'null']
          minimum: 0
          maximum: 2147483647
    BetProposal:
      type: object
      additionalProperties: false
      required: [modeId, config, wagerCents, durationSec, forFun]
      properties:
        modeId:
          $ref: '#/components/schemas/BetMode'
        gameId:
          type: string
          description: Required for game bets; absent for game-independent U2Pick.
        settledBy:
          type: string
          enum: [anyone, non_participants, hosts, me]
          description: U2Pick settler rule.
        config:
          $ref: '#/components/schemas/BetConfig'
          description: >-
            For U2Pick, the server normalizes config.question and
            config.options to match the validated question and choices.
            Other valid config fields are retained.
        question:
          type: string
          minLength: 1
          description: Required for U2Pick; ignored for game bets, whose question the server builds.
        choices:
          type: array
          minItems: 2
          uniqueItems: true
          items:
            type: string
            minLength: 1
        wagerCents:
          type: integer
          minimum: 0
          description: Non-4fun wagers must be between 10 and 1000 cents.
        durationSec:
          type: integer
          minimum: 30
          maximum: 600
          description: Pick window in whole seconds; the server assigns the deadline.
        forFun:
          type: boolean
        includesOvertime:
          type: boolean
          description: Only applicable to stat and score modes.
      allOf:
        - if:
            properties:
              forFun:
                const: false
            required: [forFun]
          then:
            properties:
              wagerCents:
                minimum: 10
                maximum: 1000
        - if:
            properties:
              modeId:
                const: u2pick
            required: [modeId]
          then:
            required: [question, choices]
            properties:
              question:
                maxLength: 120
              choices:
                maxItems: 6
                items:
                  type: string
                  minLength: 1
                  maxLength: 40
                  pattern: '^(?!\s*[Nn][Oo] [Gg][Uu][Ee][Ss][Ss]\s*$).+'
                  description: >-
                    Trimmed, case-insensitively unique, and not "No guess"
                    (reserved for joining without a pick). "Pass" is allowed
                    as a sports choice.
          else:
            required: [gameId]
            properties:
              gameId:
                type: string
              settledBy: false
        - if:
            properties:
              modeId:
                enum: [u2pick, choose_their_fate]
            required: [modeId]
          then:
            properties:
              includesOvertime: false
    BetMode:
      type: string
      enum: [either_or, king_of_the_hill, choose_their_fate, scorcerer, total_disaster, give_and_take, prop_hunt, u2pick, jackblack, holdem]
    JackblackAccess:
      type: string
      enum: [hosts, everyone, off]
      description: Who may propose Jackblack at the table; hosts set it.
    HoldemAccess:
      type: string
      enum: [hosts, everyone, off]
      description: Who may propose Hold'em at the table; hosts set it.
    HoldemProposal:
      type: object
      additionalProperties: false
      required: [modeId, wagerCents, durationSec, forFun]
      description: >-
        No-limit Texas hold'em over one full cycle (a hand per player, the
        button going round once; "Run it back" plays another).
        wagerCents is the big blind (the small blind is half; every hand
        starts everyone on the same 10-big-blind stack, so nobody busts
        out), or 0 for a 4fun game, which plays with chips worth nothing.
        durationSec is the join window. A whole stack lost in every hand, for
        the fewest players, must fit the proposer's points limit.
      properties:
        modeId:
          const: holdem
        wagerCents:
          type: integer
          minimum: 0
          maximum: 1000
        durationSec:
          type: integer
          minimum: 30
          maximum: 600
        forFun:
          type: boolean
        rules:
          type: object
          additionalProperties: false
          properties:
            decisionSec: {type: integer, minimum: 10, maximum: 60, default: 30}
            minPlayers:
              type: integer
              minimum: 2
              maximum: 9
              default: 2
              description: Fewer players than this at the deal washes the game.
            maxPlayers:
              type: integer
              minimum: 2
              maximum: 9
              default: 9
              description: Joins stop here; at least minPlayers.
    HoldemHand:
      type: object
      required: [number, buttonId, smallBlindId, bigBlindId, board, showdown, pots, shown, handNames, atShowdown, deltas]
      properties:
        number: {type: integer, minimum: 1}
        buttonId: {type: string, format: uuid}
        smallBlindId: {type: string, format: uuid}
        bigBlindId: {type: string, format: uuid}
        board: {type: array, items: {type: string}}
        showdown: {type: boolean}
        pots:
          type: array
          items:
            type: object
            required: [amount, winners]
            properties:
              amount: {type: integer, format: int64}
              winners: {type: array, items: {type: string, format: uuid}}
              handName: {type: string}
        shown:
          type: object
          description: Hole cards shown at a showdown (everyone still in), by user id.
          additionalProperties: {type: array, items: {type: string}}
        handNames:
          type: object
          additionalProperties: {type: string}
        atShowdown: {type: array, items: {type: string, format: uuid}}
        deltas:
          type: object
          description: Each player's stack change over the hand, by user id.
          additionalProperties: {type: integer, format: int64}
        holes:
          type: object
          description: Everyone's hole cards; only once the game is over.
          additionalProperties: {type: array, items: {type: string}}
    HoldemGame:
      type: object
      required: [phase]
      properties:
        phase:
          type: string
          enum: [waiting, play, results, done]
        players: {type: array, items: {type: string, format: uuid}}
        hand: {type: integer}
        hands: {type: integer}
        order: {type: array, items: {type: string, format: uuid}}
        bigBlindCents: {type: integer, format: int64}
        smallBlindCents: {type: integer, format: int64}
        stackCents:
          type: integer
          format: int64
          description: Everyone's stack at the start of every hand (10 big blinds).
        stacks:
          type: object
          description: This hand's stacks.
          additionalProperties: {type: integer, format: int64}
        deadline: {type: string, format: date-time}
        buttonId: {type: string, format: uuid}
        smallBlindId: {type: string, format: uuid}
        bigBlindId: {type: string, format: uuid}
        street: {type: string, enum: [preflop, flop, turn, river]}
        board: {type: array, items: {type: string}}
        pot: {type: integer, format: int64}
        currentBet: {type: integer, format: int64}
        toActId: {type: string, format: uuid}
        seats:
          type: array
          items:
            type: object
            required: [userId, committed, contributed, folded, allIn]
            properties:
              userId: {type: string, format: uuid}
              committed: {type: integer, format: int64}
              contributed: {type: integer, format: int64}
              folded: {type: boolean}
              allIn: {type: boolean}
        me:
          type: object
          description: Your own hole cards, and on your turn what you may do.
          properties:
            hole: {type: array, items: {type: string}}
            handName:
              type: string
              description: Your best hand with the board so far, once the flop is out.
            preMove:
              type: string
              enum: [check_fold, call_any]
              description: The pre-move you've armed (only you see it).
            toCall: {type: integer, format: int64}
            canRaise: {type: boolean}
            minRaiseTo: {type: integer, format: int64}
            maxRaiseTo: {type: integer, format: int64}
        totals:
          type: object
          description: Each player's result so far, over the finished hands.
          additionalProperties: {type: integer, format: int64}
        history: {type: array, items: {$ref: '#/components/schemas/HoldemHand'}}
        shuffles:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [round, commitment]
            properties:
              round: {type: integer, minimum: 1}
              commitment: {type: string, pattern: '^[0-9a-f]{64}$'}
              decks: {type: integer, minimum: 1, maximum: 8}
              seed: {type: string, pattern: '^[0-9a-f]{64}$'}
    JackblackProposal:
      type: object
      additionalProperties: false
      required: [modeId, wagerCents, durationSec, forFun]
      description: >-
        Everyone who joins deals once, in a random order, and
        banks that round against the rest. wagerCents is the ante per hand,
        or 0 for a 4fun game (hands still win, lose or push; totals stay at
        0); durationSec is the join window. Rules left out take their defaults (shown). The
        proposer joins their own game, so their worst case against one other
        player must fit their points limit.
      properties:
        modeId:
          const: jackblack
        wagerCents:
          type: integer
          minimum: 0
          maximum: 1000
        durationSec:
          type: integer
          minimum: 30
          maximum: 600
        forFun:
          type: boolean
        rules:
          type: object
          additionalProperties: false
          properties:
            doubling: {type: boolean, default: true}
            maxSplits: {type: integer, minimum: 0, maximum: 3, default: 1}
            blackjackPays: {type: string, enum: ['3:2', '6:5'], default: '3:2'}
            decisionSec: {type: integer, minimum: 10, maximum: 60, default: 30}
            minPlayers:
              type: integer
              minimum: 2
              maximum: 7
              default: 2
              description: Fewer players than this at the deal (the dealer included) washes the game.
            maxPlayers:
              type: integer
              minimum: 2
              maximum: 7
              default: 7
              description: Joins stop here; at least minPlayers.
    JackblackHand:
      type: object
      required: [cards, total, soft, stakeCents, doubled, done, current]
      properties:
        cards:
          type: array
          items:
            type: string
            description: Rank (A23456789TJQK) then suit (SHDC).
        total:
          type: integer
        soft:
          type: boolean
        stakeCents:
          type: integer
        doubled:
          type: boolean
        done:
          type: boolean
        current:
          type: boolean
          description: The hand being played right now (on the acting seat only).
        result:
          type: string
          enum: [win, blackjack, push, lose, bust]
        deltaCents:
          type: integer
    JackblackSeat:
      type: object
      description: >-
        One player's seat. Every seat's hands are sent to everyone, live and
        finished (cards are face up, as at a real table).
      required: [userId, hands]
      properties:
        userId:
          type: string
          format: uuid
        hands:
          type: array
          items:
            $ref: '#/components/schemas/JackblackHand'
        canDouble:
          type: boolean
          description: On your own turn, whether your current hand can double.
        canSplit:
          type: boolean
          description: On your own turn, whether your current hand can split.
        deltaCents:
          type: integer
          description: In a finished round, the seat's result.
    JackblackGame:
      type: object
      required: [phase]
      properties:
        phase:
          type: string
          enum: [waiting, play, dealer, results, done]
        players:
          type: array
          description: While waiting, who has joined, in joining order.
          items:
            type: string
            format: uuid
        round:
          type: integer
        rounds:
          type: integer
        order:
          type: array
          description: The dealing order.
          items:
            type: string
            format: uuid
        dealerId:
          type: string
          format: uuid
        dealer:
          type: array
          items:
            type: string
            description: A card, or "??" face down.
        dealerTotal:
          type: integer
        turnId:
          type: string
          format: uuid
          description: >-
            While players act, whose turn it is: one seat at a time, in order
            from the dealer, each playing every hand before the next.
        dealerMove:
          type: string
          enum: [flip, hit, stand]
          description: On the dealer's turn, what their one button does next.
        deadline:
          type: string
          format: date-time
          description: When the current decision (or the dealer's turn) times out.
        seats:
          type: array
          items:
            $ref: '#/components/schemas/JackblackSeat'
        totals:
          type: object
          description: Each player's running result in cents, by user id.
          additionalProperties:
            type: integer
        shuffles:
          type: array
          description: >-
            Each round's shoe commitment, from the deal: the SHA-256 hex of
            "cards-v1|<round>|<decks>|<seed>". Once the game is done, each
            also carries its deck count (1-8, drawn at random) and seed, so the
            commitment and the shuffle (see domain rules, "Shuffle audit") can be
            checked against the cards dealt.
          items:
            type: object
            additionalProperties: false
            required: [round, commitment]
            properties:
              round: {type: integer, minimum: 1}
              commitment: {type: string, pattern: '^[0-9a-f]{64}$'}
              decks: {type: integer, minimum: 1, maximum: 8}
              seed: {type: string, pattern: '^[0-9a-f]{64}$'}
        history:
          type: array
          items:
            type: object
            required: [number, dealerId, dealer, dealerTotal, dealerDeltaCents, seats]
            properties:
              number:
                type: integer
              dealerId:
                type: string
                format: uuid
              dealer:
                type: array
                items:
                  type: string
              dealerTotal:
                type: integer
              dealerDeltaCents:
                type: integer
              seats:
                type: array
                items:
                  $ref: '#/components/schemas/JackblackSeat'
    BetConfig:
      type: object
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: array
            items:
              type: string
    BetBaseline:
      type: object
      additionalProperties: false
      description: >-
        Snapshots of what a sports bet's mode follows (see GET
        /bets/{betId}/live), keyed by what they track: combined, margin,
        player:<id>, and for scorcerer away_big, away_small, home_big,
        home_small (NFL touchdowns and field goals, NBA 3s and 2s).
      properties:
        proposed:
          type: object
          description: When the bet was proposed.
          additionalProperties:
            type: integer
        locked:
          type: object
          description: When picks locked.
          additionalProperties:
            type: integer
        result:
          type: object
          description: When the bet was resolved or washed (its numbers stop there).
          additionalProperties:
            type: integer
        resultGame:
          type: object
          additionalProperties: false
          description: The game's status, period, clock and score when the bet was called.
          properties:
            status: {type: string}
            period: {type: [integer, 'null']}
            clock: {type: [string, 'null']}
            awayScore: {type: [integer, 'null']}
            homeScore: {type: [integer, 'null']}
    Bet:
      type: object
      additionalProperties: false
      required: [id, tableId, proposerId, modeId, config, question, choices, wagerCents, forFun, status, locksAt, myPick, myParticipation, participantIds, pickCount, pointsSettled, viewerCanCall, viewerCanOverride]
      properties:
        viewerCanCall:
          type: boolean
          description: >-
            The caller may call this Pending U2Pick's result now, by its settler
            rule. Computed with the rule the result call enforces.
        viewerCanOverride:
          type: boolean
          description: >-
            The caller is a host and this sports bet's points aren't settled, so
            they may wash it or set its result.
        id:
          type: string
          format: uuid
        tableId:
          type: string
          format: uuid
        proposerId:
          type: string
          format: uuid
        modeId:
          $ref: '#/components/schemas/BetMode'
        gameId:
          type: string
        config:
          $ref: '#/components/schemas/BetConfig'
        question:
          type: string
        choices:
          type: array
          items:
            type: string
        wagerCents:
          type: integer
          minimum: 0
        forFun:
          type: boolean
        status:
          type: string
          enum: [ACTIVE, PENDING, SETTLED, WASHED]
        locksAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        lockedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
        settledAt:
          type: string
          format: date-time
          description: Time the table host settled this bet's points, not when its outcome resolved.
        pointsSettled:
          type: boolean
          description: >-
            Whether the host has settled this bet's points. Distinct from
            status SETTLED, which means the bet outcome has resolved.
        baseline:
          $ref: '#/components/schemas/BetBaseline'
        includesOvertime:
          type: boolean
        settledBy:
          type: string
          enum: [anyone, non_participants, hosts, me]
        overriddenBy:
          type: string
          format: uuid
          description: The host who last overrode this sports bet's result.
        overriddenAt:
          type: string
          format: date-time
        calledBy:
          type: string
          format: uuid
        winningChoice:
          type: string
        washReason:
          type: string
        overridden:
          type: boolean
        deltasCents:
          type: object
          description: Resolved per-user deltas in cents.
          additionalProperties:
            type: integer
            format: int64
        pickCount:
          type: integer
          minimum: 0
          description: Number of participants with a selection; excludes those with no guess.
        myPick:
          type: [string, 'null']
          description: The authenticated user's own selection; null means no guess or no participation.
        myParticipation:
          type: string
          enum: [not_joined, no_guess, picked]
          description: The caller's own participation state, including while ACTIVE.
        picks:
          type: array
          description: Omitted while ACTIVE.
          items:
            type: object
            additionalProperties: false
            required: [userId, choice]
            properties:
              userId:
                type: string
                format: uuid
              choice:
                type: string
        rematch:
          type: object
          additionalProperties: false
          required: [id, status, locksAt, joined]
          description: >-
            A finished card game's "Run it back", once someone started it:
            the new game, its status and join deadline, and whether you're in.
          properties:
            id: {type: string, format: uuid}
            status: {type: string, enum: [ACTIVE, PENDING, SETTLED, WASHED]}
            locksAt: {type: string, format: date-time}
            joined: {type: boolean}
        participantIds:
          description: >-
            Everyone in the bet, in joining order, in every status: pickers,
            No guess participants while it's open (who cleared a pick; they're
            out of the bet once it locks) and a card game's players. Which
            side each picked stays private until lock.
          $ref: '#/components/schemas/UuidList'
      allOf:
        - if:
            properties:
              myParticipation:
                const: picked
            required: [myParticipation]
          then:
            properties:
              myPick:
                type: string
                minLength: 1
              pickCount:
                minimum: 1
          else:
            properties:
              myPick:
                type: 'null'
        - if:
            properties:
              status:
                const: ACTIVE
            required: [status]
          then:
            properties:
              picks: false
          else:
            required: [picks]
            properties:
              picks: true
        - if:
            properties:
              status:
                enum: [ACTIVE, PENDING]
            required: [status]
          then:
            properties:
              calledBy: false
              winningChoice: false
              washReason: false
              deltasCents: false
              pointsSettled:
                const: false
    CurrentUser:
