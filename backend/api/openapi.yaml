        invites remain.
      responses:
        '200':
          description: >-
            Pending invitations include the table name, emoji, a member
            preview and the member count needed for the request card, without
            granting access to the table's chat or bets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TableInvite'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tables/{tableId}/members/{userId}/bets:
    parameters:
      - $ref: '#/components/parameters/TableId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listMemberBets
      summary: Bets at a table that involve a member, newest first
      description: >-
        Ones they proposed and ones they joined once picks are public (after
        lock); the caller's own Active participation counts too. Same
        projection as listTableBets. For the profile popup.
      parameters:
        - $ref: '#/components/parameters/Cursor'
