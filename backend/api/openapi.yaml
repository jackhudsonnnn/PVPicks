openapi: 3.1.0
info:
  title: P2Picks backend API
  version: 0.1.0-draft
  description: >-
    Phase 0 draft. Dev implements authentication, admin health, table and
    settings and debt reads, relationship and invitation reads,
    invite preference replacement, debt-cap updates, feedback submission,
    follow/block mutations, table creation, member requests, profile and betting settings,
    invitation responses, reaction mutations and chat
    unread-state reads and updates, chat window reads and text/GIF sending,
    U2Pick proposal, picks and results, host points settlement, and receipt,
    group and balance-change-review reads and actions. Other operations remain
    unimplemented.
    This contract is not ready for client generation until the complete
    Phase 0 review.
    In dev, browser requests are same-origin. All POST, PUT, PATCH and DELETE
    requests, including login and logout, require the X-CSRF-TOKEN header
    obtained from GET /auth/csrf, and an allowed Origin. Invalid or missing
    CSRF protection returns 403 before performing the operation. The CSRF
    requirement is not yet enumerated on every draft operation below.
    Admin audit views must not expose ACTIVE participation, picks or
    user-specific participation-derived counts. Admin accounts cannot access
    player APIs; login, logout and GET /me remain available. Picks are revealed
    when the bet locks.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /auth/csrf:
    get:
      operationId: getCsrfToken
      security: []
      summary: Obtain a CSRF token before a browser mutation
      description: >-
        Returns a token associated with a host-only HttpOnly CSRF cookie.
        The client sends the returned token in X-CSRF-TOKEN on mutations.
        This response must not be cached. Fetch a new token after login or
        logout; a token from before rotation will not match the new cookie.
      responses:
        '200':
          description: CSRF token and its accompanying cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /auth/login:
    post:
      operationId: login
      security: []
      summary: Start a session for a provisioned account
      description: >-
        Dev and LAN accounts are provisioned; production registration policy
        will be decided after the LAN rehearsal. Failed sign-ins are
        throttled (429 `rate_limited`, with Retry-After): by default 10
        failures per account name or 50 per client address within 15
        minutes block further attempts, even correct ones, until the window
        ends; a success clears the account's count. In dev, normalize the username
        by trimming and lowercasing; verify the password exactly. Unknown,
        frozen and deleted accounts and wrong passwords receive the same 401.
        Login rotates the CSRF token. An existing session, if any, is revoked
        before the new one is issued.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '204':
          description: Authenticated; the server sets the session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Origin or CSRF rejected, or, after a correct password, the account
            is frozen (code `account_frozen`). Frozen accounts can't sign in;
            freezing also ends their sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/setup:
    post:
      operationId: redeemSetupCode
      security: []
      summary: Set your password with a setup or reset code
      description: >-
        Redeems a single-use code an admin issued (the link is
        /setup#<code>; the code stays in the URL fragment). Sets the
        password, ends the account's other sessions and signs in, like
        login, which also rotates the CSRF token. A password the rules
        reject (code `weak_password`) leaves the code unused. Password rules:
        12 to 64 characters and at most 72 bytes, not containing the
        username, not a common password. Failed codes count toward the
        per-address sign-in throttle.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, password]
              properties:
                code:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '204':
          description: Password set and signed in; the server sets the session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
        '400':
          description: >-
            Malformed body, an expired, used or unknown code (code
            `invalid_setup_code`), or a password the rules reject (code
            `weak_password`, with a message for the player).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/password:
    post:
      operationId: changePassword
      summary: Change your own password
      description: >-
        Any signed-in account, player or admin. Needs the current password;
        ends the account's other sessions and keeps this one. Wrong current
        passwords count toward the sign-in throttle.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
      responses:
        '204':
          description: Changed.
        '400':
          description: Malformed body, or a new password the rules reject (code `weak_password`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The current password is wrong (code `wrong_password`), or origin or CSRF rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      description: >-
        Revoke the current session server-side, expire its cookie and rotate
        the CSRF token. Other sessions are unaffected.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session ended.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me:
    get:
      operationId: getMe
      summary: Get the authenticated user
      responses:
        '200':
          description: Current user, with their role (admins cannot use player APIs).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteMe
      summary: Delete the current account
      description: >-
        Erases personal data, retains ledger history as Deleted user, and
        transfers hosted tables according to the deletion rules.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Account deleted and session ended.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/profile:
    patch:
      operationId: updateMyProfile
      summary: Change the current user's display profile
      description: >-
        Dev implementation. Normalize the username before validation and
        comparison; a taken name returns 409 with code username_taken. A rename
        releases the old username and changes future login, but does not revoke
        existing sessions or rewrite historical free-text chat. A matching retry
        rechecks authentication and returns the current profile without
        reapplying. Changes write an internal event, not a delivered update.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/debt:
    get:
      operationId: getMyDebt
      summary: Get current debt in integer cents
      description: >-
        Sum negative table True balances and negative open person settle-up
        nets; positive balances do not offset debt elsewhere. Current
        non-archived memberships contribute unsettled non-4fun results minus
        pending picked wagers. Open receipts include archived tables, and a
        receipt closed by a sent settle still counts until the receiver's
        48-hour reject window passes. The response
        uses one database snapshot and does not enforce the cap.
      responses:
        '200':
          description: Current debt.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [debtCents]
                properties:
                  debtCents:
                    type: integer
                    format: int64
                    minimum: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/debt-cap:
    get:
      operationId: getMyDebtCap
      summary: Get the current debt cap
      description: An absent cap row or a null stored cap means disabled.
      responses:
        '200':
          description: The current cap, or null when disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtCap'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateMyDebtCap
      summary: Set or disable the debt cap
      description: >-
        A null cap disables the limit. A change is allowed only when current
        debt is zero, including when setting the same value again with a new
        key. New caps must be whole points in cents (a multiple of 100), at
        most 2147483600 cents. Matching retries do not reapply the update even
        if debt has since changed. Existing fractional-point cap values
        remain readable. Proposal, pick and lock transactions enforce the cap.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DebtCap'
                - type: object
                  properties:
                    capCents:
                      type: [integer, 'null']
                      multipleOf: 100
      responses:
        '204':
          description: Cap updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /tables/{tableId}/bets:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      operationId: listTableBets
      summary: List the table's live bets
      description: >-
        The live set, oldest first: Active and Pending bets, and resolved
        non-4fun bets whose points aren't settled yet (the same set that
        blocks deleting the table). Older bets are read one at a time
        (getBet) or per member (listMemberBets).
      responses:
        '200':
          description: Each bet contains only the caller's own pick while Active.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: proposeBet
      summary: Propose a bet at a table
      description: >-
        Dev implementation for U2Pick and every sports mode except
        choose_their_fate. Sports modes send gameId and includesOvertime
        (default true; ignored by scorcerer) and a config: score modes
        config.line in half points (the total for total_disaster, the home
        team's spread for give_and_take); player modes config.stat (a key
        from GET /games/{gameId}/players) and config.players (player ids from
        that game: one for prop_hunt, two for either_or and king_of_the_hill)
        plus config.line for prop_hunt (half points, above the player's
        current number) and king_of_the_hill (a whole-number target above
        both players' numbers); scorcerer (NFL only) takes no config. The
        server builds the question and choices from the stored game and
        players. Terms the game can't take answer 409 invalid_terms. A game
        bet can be proposed until its game is Final, canceled or postponed
        (409 game_unavailable); picks lock at the window's end or the game's
        start, whichever is first, and some picks wash at lock (domain rules,
        "Wash triggers").
        The server checks table permissions, wager rules and debt cap, and
        assigns the bet identity and lock time. The
        proposer is the visible author but does not join the bet automatically.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BetProposal'
      responses:
        '201':
          description: Bet created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /bets/{betId}/live:
    parameters:
      - name: betId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getBetLiveStats
      summary: A sports bet's live stats
      description: >-
        What the bet's mode follows (the combined score, the home margin, each
        chosen player's stat, or each team's touchdowns and field goals), as it
        was when the bet was proposed, when picks locked, and now, with the
        game's score and clock. Same access as the bet. 404 for a bet without
        a game (U2Pick). Bets made before these snapshots existed have only the
        current numbers.
      responses:
        '200':
          description: Live stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetLiveStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/bets:
    get:
      operationId: listMyBets
      summary: List bets at the caller's current tables, newest first
      description: >-
        Bets at every non-archived table the caller is a member of (or one of
        them with tableId), using the same projection as listTableBets: each
        Active bet contains only the caller's own pick.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, PENDING, SETTLED, WASHED]
        - $ref: '#/components/parameters/OptionalTableId'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: A page of bets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tables/{tableId}/tomatoes:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      operationId: listRecentTomatoes
      summary: Tomatoes thrown at the table in the last 30 seconds
      description: >-
        For animating throws after a tomatoes.changed invalidation. Requires
        current membership of a non-archived table. Throws involving anyone
        the caller is in a block relationship with (either direction) are
        omitted.
      responses:
        '200':
          description: Recent throws, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TomatoThrow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: throwTomato
      summary: Throw a tomato at another member
      description: >-
        A playful effect every member sees; it never changes points or files
        a report. Requires the caller's reaction permission. The target must
        be another active current member with no block relationship with the
        caller in either direction (otherwise 404). One throw per thrower per
        table every 5 seconds (429 with Retry-After).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetId]
              properties:
                targetId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Thrown.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tables/{tableId}/balances:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      operationId: listTableBalances
      summary: Each current member's points at the table
      description: >-
        settleCents is what the next points settlement would move: the
        member's ledger deltas from resolved bets whose points are not yet
        settled. trueCents also subtracts their wagers in Pending (locked)
        non-4fun pots, the worst case. Active picks are never counted. Members
        can already read every input through bet reads. Requires current
        membership of a non-archived table.
      responses:
        '200':
          description: One balance per current member.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TableBalance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /bets/{betId}:
    parameters:
      - $ref: '#/components/parameters/BetId'
    get:
      operationId: getBet
      summary: Get a bet visible to the current table member
      responses:
        '200':
          description: >-
            Bet view. Other players' participation and picks are omitted while
            ACTIVE; the caller can see their own pick and aggregate counts.
            Picks are revealed after lock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /bets/{betId}/pick:
    parameters:
      - $ref: '#/components/parameters/BetId'
    put:
      operationId: putMyPick
      summary: Add or change the current user's pick
      description: Dev implementation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [choice]
              properties:
                choice:
                  type: string
                  minLength: 1
      responses:
        '204':
          description: Pick accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: clearMyPick
      summary: Clear the current user's guess
      description: Dev implementation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Pick cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /bets/{betId}/settle:
    parameters:
      - $ref: '#/components/parameters/BetId'
    post:
      operationId: settleCustomBet
      summary: Call the result of a U2Pick bet
      description: >-
        Dev implementation for U2Pick.
        Only a settler authorized by the proposal may call a pending original
        U2Pick. Game bets are settled exclusively by the sports feed.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [winningChoice]
              properties:
                winningChoice:
                  type: [string, 'null']
                  description: Null indicates an outcome outside the choices; a string must match a choice exactly.
      responses:
        '204':
          description: Result accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /bets/{betId}/override:
    parameters:
      - $ref: '#/components/parameters/BetId'
    post:
      operationId: overrideSportsBet
      summary: A host washes a sports bet or sets its result
      description: >-
        Dev implementation for the score modes. A current host may wash
        (winningChoice null) or set the result to one of the bet's choices
        while it is Active (it locks first), Pending, or resolved with the
        table's points not yet settled (409 points_settled after). A
        correction appends compensating ledger entries. No reason is asked
        for. The override is recorded on the bet (overriddenBy, overriddenAt)
        and posted in chat naming the host.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [winningChoice]
              properties:
                winningChoice:
                  type: [string, 'null']
      responses:
        '204':
          description: Overridden.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /bets/{betId}/wash:
    parameters:
      - $ref: '#/components/parameters/BetId'
    post:
      operationId: washQuickPick
      summary: Wash an eligible Quick Pick copy
      description: >-
        A subscriber-table host may wash their copy before table points
        settlement, including after resolution. Reversal of posted deltas must
        use atomic zero-sum compensating ledger entries.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Copy washed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tables:
    get:
      operationId: listMyTables
      summary: List the current user's tables
      description: >-
        Returns current, non-archived memberships as summaries (at most 100,
        the table limit), most recent activity first: the later of the
        table's last bet and when the caller joined. Summaries never carry
        whole member lists; GET /tables/{tableId} returns the full table.
      responses:
        '200':
          description: Tables the user belongs to.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/TableSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTable
      summary: Create a table hosted by the current user
      description: >-
        Creates the table and applies eligible initial member requests atomically.
        On retry the table view reflects current authorized state, while outcomes
        remain those of the original request. Returns 404 if access is lost.
        Returns 409 `table_limit` when the caller is already at 100 tables (a
        matching retry of an earlier success still replays).
        Rate limited to 10 new tables an hour per account (429).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, emoji]
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Trimmed before validation and storage; at most 14 Unicode code points after trimming.
                emoji:
                  type: string
                  description: One ICU-supported RGI emoji sequence.
                memberIds:
                  type: array
                  uniqueItems: true
                  maxItems: 100
                  items:
                    type: string
                    format: uuid
                  description: Optional requested members; eligibility is evaluated individually.
      responses:
        '201':
          description: Table created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableCreationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tables/archives:
    get:
      operationId: listMyTableArchives
      summary: List the caller's available table chat archives
      description: >-
        Dev implementation. An active user sees archives for tables where they
        were a member at deletion, for 90 days (2160 hours) after deletion.
        Expiry removes access and listing, but does not delete retained data.
      responses:
        '200':
          description: Available archives, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TableArchive'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tables/{tableId}:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      operationId: getTable
      summary: Get a table visible to the current user
      description: >-
        Requires current membership. Missing, archived and non-member tables
        return 404. Quick Pick codes are visible only to current hosts; disabled
        permissions are visible to hosts for all members and otherwise only
        for the caller.
      responses:
        '200':
          description: Table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTable
      summary: Update table name and emoji
      description: >-
        Only a current host may update the table. An actual change adds a
        neutral system chat notice without storing the table name in chat.
        No changes are made for unchanged values. A matching retry rechecks
        host access and returns the current table without reapplying the update.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Trimmed before validation and storage; at most 14 Unicode code points after trimming.
                emoji:
                  type: string
                  description: One ICU-supported RGI emoji sequence.
      responses:
        '200':
          description: Updated table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteTable
      summary: Delete an eligible table
      description: >-
        Dev implementation. Only a host may delete a table. Active or Pending bets and resolved
        non-4fun bets whose points have not been settled prevent deletion.
        The table is removed from normal active-table views; its chat remains
        read-only for members at deletion, subject to block filtering and
        account-deletion rules, for 90 days after deletion. Open receipts remain
        part of debt; personal settlement-history actions are not implemented.
        Existing Quick Pick copies survive. Pending invitations are cancelled
        and subscriptions disconnected. An authorized matching retry succeeds
        without reapplying; a fresh key for an archived table returns 404.
        Concurrent membership changes can return a retryable 409.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Table deleted from normal active-table views.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: Unsettled bets, a membership race, or an idempotency conflict.
  /tables/{tableId}/settings:
    parameters:
      - $ref: '#/components/parameters/TableId'
    patch:
      operationId: updateTableSettings
      summary: Change table-wide betting settings
      description: >-
        Only a current host may change these switches. Changes affect future
        proposals and Quick Pick fan-out, not existing bets. Actual changes
        create neutral system chat notices and internal outbox events. An
        unchanged value is a no-op. A matching retry rechecks host access and
        returns the current table without reapplying earlier values. Proposal
        and Quick Pick services are not implemented yet.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                hostsOnlyBets:
                  type: boolean
                u2pickEnabled:
                  type: boolean
                pollsEnabled:
                  type: boolean
                  description: >-
                    Whether members can start new chat polls. Turning it off
                    doesn't close existing polls; they keep taking votes.
      responses:
        '200':
          description: Updated table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tables/{tableId}/remainder:
    parameters:
      - $ref: '#/components/parameters/TableId'
    patch:
      operationId: updateRemainderRule
      summary: Change the remainder rule when no bet is Active
      description: |
        Only a current host may change the rule. A fresh request that would
        change it returns 409 while any bet is Active; Pending bets retain
        their lock-time snapshots. An unchanged rule is a successful no-op,
        including while a bet is Active. A matching retry rechecks current host
        access and never reapplies the old value. An actual change adds a
        system chat message. Bet proposal and locking are not yet implemented.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rule]
              properties:
                rule:
                  $ref: '#/components/schemas/RemainderRule'
      responses:
        '204':
          description: Rule updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: An Active bet prevents a change, or the idempotency key conflicts.
  /tables/{tableId}/members:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      operationId: searchTableMembers
      summary: Search a table's members by username
      description: >-
        Members of one of the caller's tables whose username contains `q`,
        by username, 50 at a time. Same access as the table (404 otherwise).
        Rate limited to 60 a minute per account.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_ ]{1,40}$'
          description: 1 to 15 letters, numbers or underscores (trimmed, case-insensitive).
        - name: cursor
          in: query
          schema:
            type: string
          description: The previous page's nextCursor.
      responses:
        '200':
          description: Matching member ids.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items:
                      type: string
                      format: uuid
                  nextCursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: addTableMembers
      summary: Add or invite eligible users
      description: >-
        The host requests additions. Each user's relationship, invite
        preferences, pending invitations and blocks determine the outcome.
        Eligible open preferences add immediately; request creates a pending
        invitation. Frozen, deleted, unavailable, blocked, already-present and
        otherwise ineligible accounts all return not_added. So do accounts at
        their 100-table limit, a table at its 500-member limit, and, for a
        request, accounts with 100 requests waiting (no request is created).
        A request older than 30 days has expired and doesn't block a new one.
        Matching retries require current host access and return original
        outcomes without repeating actions. Pending invitations are not
        announced in table chat.
        Rate limited to 30 calls an hour per account (429); each call takes
        up to 100 people.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userIds]
              properties:
                userIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Per-user outcomes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberRequestOutcome'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tables/{tableId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/TableId'
      - $ref: '#/components/parameters/UserId'
    delete:
      operationId: removeTableMember
      summary: Remove another member
      description: >-
        Dev implementation. A current host may remove another current member,
        including a frozen member, but must first demote another host. Removal
        is blocked while any table bet is Active or Pending, or any resolved
        non-4fun bet awaits points settlement. A 409 with code
        member_removal_unsettled allows a client to offer permission controls;
        member_removal_host means the target must first be demoted.
        Records and receipts remain, pending invitations involving the target
        are cancelled, and their chat read position is retained. Matching
        retries recheck actor access and do not remove a subsequently readded
        member. The outbox event is internal and delivery is not implemented.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Member removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tables/{tableId}/hosts/{userId}:
    parameters:
      - $ref: '#/components/parameters/TableId'
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: promoteTableHost
      summary: Promote a member to host
      description: |
        A current host may promote a current member, including a frozen member.
        Promotion clears all member permission restrictions. A current host
        target is a successful no-op. Actual changes create a system chat line
        using the subject's current display name; deleted subjects display as
        Deleted user. Matching retries recheck current host access and target
        membership without reapplying.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Host added.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: demoteTableHost
      summary: Demote a host, retaining at least one host
      description: |
        A current host may demote a current member, including themselves,
        provided at least one other active host remains. A non-host target is
        a successful no-op. Demotion permanently cancels that host's pending
        invitations for this table and does not restore prior member limits.
        A matching retry rechecks current host access; a host who has stepped
        down therefore receives 403 on a retry until promoted again. A later
        account freeze can still leave a table without an active host.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Host demoted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: No other active host would remain, or the idempotency key conflicts.
  /tables/{tableId}/members/{userId}/permissions:
    parameters:
      - $ref: '#/components/parameters/TableId'
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: updateMemberPermission
      summary: Enable or disable a permission for a non-host member
      description: |
        A current host may change another current non-host member's permission,
        including a frozen member. Hosts always retain every permission.
        Changes do not create a chat message. A matching retry rechecks current
        access and target role without reapplying the original change. A
        non-host caller receives 403; a missing, archived or inaccessible table,
        unavailable user or non-member target receives 404; a host target or
        conflicting idempotency key receives 409. Bet authorization is not yet
        implemented; storing the bets permission does not enforce it.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [permission, enabled]
              properties:
                permission:
                  type: string
                  enum: [bets, text, react, gifs, polls]
                enabled:
                  type: boolean
      responses:
        '204':
          description: Permission updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tables/{tableId}/quick-picks/share:
    parameters:
      - $ref: '#/components/parameters/TableId'
    post:
      operationId: enableQuickPickSharing
      summary: Enable sharing using the table's existing code
      description: >-
        Dev implementation; requires a current host and Quick Picks enabled.
        Matching retries recheck access and do not reapply. Changes write
        neutral chat and internal outbox events; no event delivery exists.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Sharing enabled.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: disableQuickPickSharing
      summary: Disable sharing without deleting the table's code
      description: >-
        Dev implementation; current hosts can disable sharing. Existing
        subscribers are disconnected; existing copies and the code remain.
        Authorized matching retries do not reapply.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Sharing disabled.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tables/{tableId}/quick-picks/rotate:
    parameters:
      - $ref: '#/components/parameters/TableId'
    post:
      operationId: rotateQuickPickCode
      summary: Rotate a table's code and disconnect old subscribers
      description: >-
        Dev implementation; current hosts can rotate whether or not sharing
        is enabled. Incoming subscriptions are disconnected and copies remain.
        A matching retry rechecks host access and returns the current code,
        without rotating again. Historical codes are not permanently reserved;
        subscription authorization and safe code reuse require further design.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: New code.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code]
                properties:
                  code:
                    $ref: '#/components/schemas/QuickPickCode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tables/{tableId}/quick-picks/subscribe:
    parameters:
      - $ref: '#/components/parameters/TableId'
    post:
      operationId: subscribeQuickPicks
      summary: Subscribe the table to a sharing source by code
      description: >-
        Only a host of a table with Quick Picks enabled may subscribe it to a
        different table that is currently sharing. Reject duplicate
        subscriptions. Backfill eligible Active original bets already open at
        the source, then copy new originals. Copies never fan out. A target
        with U2Pick disabled does not receive U2Pick copies.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  description: Spaces and hyphens are ignored; matching ignores case.
      responses:
        '204':
          description: Subscribed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: unsubscribeQuickPicks
      summary: Unsubscribe from one source without deleting existing copies
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: sourceTableId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Unsubscribed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /chat/{tableId}/messages:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      operationId: listChatMessages
      summary: Read a window of table chat
      description: >-
        Dev supports current members of non-archived tables and archive members
        within 90 days after deletion. Archived chat is read-only. With no parameter,
        returns up to the latest 30 visible messages. Use around with a visible
        message ID (such as firstUnreadMessageId) for up to five preceding
        messages and 25 from that message onward. Use before or after with
        returned opaque cursors for up to 25 older or newer messages. Supply
        at most one parameter. Items are ordered oldest first. Visible text
        and GIF messages exclude deleted authors and authors blocked by the
        caller; bet, system and settlement messages remain visible. Reactions
        from deleted users are omitted, but reactions on visible messages are
        not otherwise filtered by blocks. Bet messages contain no picks;
        settlement summaries contain original amounts and parties only.
        Previous cursors are null when no older visible messages exist. Every
        nonempty window has a next cursor, including at the current end, so
        clients can retain it and fetch later arrivals without gaps. An empty
        window has null cursors; retain the prior next cursor to poll again.
        Cursors are bound to the user and table and survive boundary-message
        deletion. An unavailable or hidden around anchor returns 404.
      parameters:
        - name: before
          in: query
          description: The previousCursor from an earlier response.
          schema:
            type: string
        - name: after
          in: query
          description: The nextCursor from an earlier response.
          schema:
            type: string
        - name: around
          in: query
          description: A currently visible message ID, including firstUnreadMessageId.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A chat window.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, previousCursor, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatMessage'
                  previousCursor:
                    type: [string, 'null']
                  nextCursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tables/{tableId}/messages:
    parameters:
      - $ref: '#/components/parameters/TableId'
    post:
      operationId: sendChatMessage
      summary: Send a text or GIF to a table
      description: >-
        Dev requires current membership in a non-archived table and the
        relevant text or GIF permission. Text is trimmed as in the prototype,
        must be valid PostgreSQL text and contain 1–2000 Unicode code points
        after trimming. GIF IDs are restricted to the current prototype
        catalog. A matching retry rechecks authentication, membership,
        permission and unchanged message content, then returns the original
        201 representation without creating another message. It does not
        include later reactions. A removed or changed message, missing table
        or lost membership returns 404; a disabled permission returns 403. Reusing the
        key for a different request returns 409. This stores an internal outbox
        event but does not deliver chat. Rate limiting is not
        implemented in dev.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [kind, text]
                  properties:
                    kind:
                      const: text
                    text:
                      type: string
                      minLength: 1
                      description: 1–2000 Unicode code points after trimming.
                - type: object
                  additionalProperties: false
                  required: [kind, gifId]
                  properties:
                    kind:
                      const: gif
                    gifId:
                      type: string
                      minLength: 1
                      enum: [g1, g2, g3, g4, g5, g6, g7, g8, g9, g10, g11, g12, g13, g14, g15, g16, g17, g18, g19, g20, g21, g22, g23, g24]
      responses:
        '201':
          description: Message created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tables/{tableId}/polls:
    parameters:
      - $ref: '#/components/parameters/TableId'
    post:
      operationId: createChatPoll
      summary: Start a poll in a table's chat
      description: >-
        The caller must be a current member of a non-archived table with the
        polls permission, and the table must have polls on (403 polls_off).
        The question (1–200 code points) and 2–6 options (1–80 code points
        each, different ignoring case) are trimmed like text messages. A
        matching retry returns the original 201 representation. The poll never
        closes.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question, options]
              properties:
                question:
                  type: string
                  minLength: 1
                options:
                  type: array
                  minItems: 2
                  maxItems: 6
                  items:
                    type: string
                    minLength: 1
      responses:
        '201':
          description: Poll created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /messages/{messageId}/vote:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    put:
      operationId: putMyPollVote
      summary: Vote for one option of a poll, or change the vote
      description: >-
        Any current member of the poll's non-archived table can vote, even
        when polls are off or their polls permission is disabled (those only
        stop new polls). Polls by authors the caller blocked are hidden and
        return 404. A matching retry returns 204 without reapplying.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [option]
              properties:
                option:
                  type: integer
                  minimum: 0
                  maximum: 5
                  description: Index into the poll's options.
      responses:
        '204':
          description: Vote recorded.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: removeMyPollVote
      summary: Remove the current user's vote
      description: Same access and retry rules as PUT. No request body is accepted.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Vote removed, or there was none.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /messages/{messageId}/reaction:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    put:
      operationId: putMyReaction
      summary: Set or replace the current user's reaction
      description: >-
        Dev accepts exactly one Unicode RGI emoji sequence as defined by
        ICU4J 76.1 (Emoji 16.0). The caller must be a current member of a
        non-archived table with react permission. Only visible text, GIF,
        poll and bet messages can be reacted to. Text and GIF messages from authors
        blocked by the caller are hidden; bet cards remain visible. Missing,
        inaccessible and non-reactable messages return the same 404. A matching
        retry returns 204 without reapplying, after rechecking current access;
        reusing the key for a different request returns 409.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [emoji]
              properties:
                emoji:
                  type: string
                  minLength: 1
                  description: Exactly one ICU4J 76.1 RGI emoji sequence.
      responses:
        '204':
          description: Reaction set.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: removeMyReaction
      summary: Remove the current user's reaction
      description: >-
        Dev removes only the caller's reaction, if present. The same access,
        visibility and retry rules as PUT apply. No request body is accepted.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Reaction removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tables/{tableId}/settle-points:
    parameters:
      - $ref: '#/components/parameters/TableId'
    post:
      operationId: settleTablePoints
      summary: Settle a table's resolved balances through the host
      description: >-
        Dev implementation. A matching retry requires current host
        authorization and returns the settlement with current receipt statuses.
        Creates a separate settlement with immutable payer, payee and amount
        identities. The server atomically settles eligible results, creates
        receipt lines, and posts a static chat summary. When eligible resolved
        non-4fun bets net to zero for everyone, a host can still settle them;
        the settlement links and marks those bets without zero-amount receipts.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Settlement created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /people/{userId}/settles:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listSettles
      summary: Settle history with one person
      description: >-
        Every settle between the caller and this person, newest first, 20 per
        page, including rejected ones (kept for audit). 404 when the two have
        no receipts.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: A page of settles.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Settle'
                  nextCursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createSettle
      summary: Settle chosen open receipts with one person
      description: >-
        Closes the chosen open receipts between the caller and this person at
        once. The selection nets, from the caller's side, to what they pay
        (negative) or receive. `sent`: the net payer says they paid; it
        counts as paid at once, the receiver can reject it for 48 hours
        (which reopens the receipts), and the debt cap keeps counting it
        until then. `received`: the net receiver, or either side at a zero
        net, records it paid; final at once. `forgiven`: the person owed
        gives up receipts that are all owed to them; final at once. At most 3
        sends between the two in any 24 hours (both directions, rejected ones
        included): 429 `settle_limit`. Other refusals are 409:
        `stale_selection` (a receipt isn't open any more),
        `invalid_settle` (wrong side for this kind),
        `settlement_review_required` (a balance change to review first). A
        matching retry returns the same settle.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, lineIds]
              properties:
                kind:
                  type: string
                  enum: [sent, received, forgiven]
                lineIds:
                  type: array
                  minItems: 1
                  maxItems: 500
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        '201':
          description: The settle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /settles/{settleId}/reject:
    parameters:
      - name: settleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: rejectSettle
      summary: Reject a sent settle within its window
      description: >-
        Only the receiver of a `sent` settle, before `rejectBy`. Its receipts
        reopen; the settle stays in History as rejected. 409 `not_rejectable`
        once the window has passed or it was already rejected.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The rejected settle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /people/settle-groups:
    get:
      operationId: listSettlementGroups
      summary: Get the current user's settle-up groups
      description: >-
        Dev implementation.
        Everyone the caller has open receipts with, or a sent settle still
        inside its reject window (either direction). If any open group net
        exceeds the signed 64-bit range, the entire response fails with 409
        and code group_net_out_of_range. Groups with a nonzero net come
        first, newest activity first; groups at a zero net come last.
      responses:
        '200':
          description: Groups with their open receipts and net, the caller's pending review, and in-window settles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SettlementGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /people/settlement-reviews:
    get:
      operationId: listPendingSettlementReviews
      summary: List the caller's pending balance-change warnings
      description: >-
        Dev implementation.
        Returns only the caller's unreviewed warnings for direct receipt parties,
        including after all receipts close. This read does not calculate group
        nets and remains available when a group total is out of range.
      responses:
        '200':
          description: The caller's pending warnings, most recently updated first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingSettlementReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/{userId}/settlement-review:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getSettlementReview
      summary: Read the caller's balance-change warning for one person
      description: >-
        Dev implementation.
        Accessible only to a direct receipt party, including after all receipts
        close. A null revision means there is no unreviewed warning. This read
        is independent of group net size.
      responses:
        '200':
          description: The caller's current pending review, if any.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{userId}/settlement-review/acknowledge:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: acknowledgeSettlementReview
      summary: Acknowledge the caller's current balance-change warning
      description: >-
        Dev implementation.
        Acknowledges only the caller's warning at the supplied revision.
        A changed warning returns 409 with code stale_review; a matching retry
        never acknowledges a newer warning.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision:
                  type: string
                  format: uuid
      responses:
        '204':
          description: Warning acknowledged or the original acknowledgment replayed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tables/{tableId}/quick-picks:
    parameters:
      - $ref: '#/components/parameters/TableId'
    put:
      operationId: setQuickPicksEnabled
      summary: Enable or disable Quick Picks at a table
      description: >-
        Dev implementation; a current host can enable or disable Quick Picks.
        Enabling also enables sharing with the existing code. Disabling stops
        sharing, disconnects subscribers to this table, and
        removes this table's subscriptions to other sources. It does not
        remove existing copies or the table's persistent code. A matching
        retry rechecks host access without reapplying; actual changes write
        neutral system chat and internal outbox events, not deliveries.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '204':
          description: Quick Picks setting updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/relationships:
    get:
      operationId: getMyRelationships
      summary: Get the current user's social relationships
      description: >-
        Excludes follows across blocks in either direction and relationships to
