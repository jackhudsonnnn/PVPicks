      blocked the other, using the same 404 as an absent or deleted user.
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: followUser
      summary: Follow a user
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
