server:
  address: 127.0.0.1

pvpicks:
  bet-lock-worker:
    enabled: ${PVPICKS_BET_LOCK_WORKER_ENABLED:true}
  outbox-relay:
    enabled: ${PVPICKS_OUTBOX_RELAY_ENABLED:true}
  outbox-cleanup:
    enabled: ${PVPICKS_OUTBOX_CLEANUP_ENABLED:true}
    retention: ${PVPICKS_OUTBOX_RETENTION:P7D}
  sports:
    # Without a key the feed is not polled and the ticker reports itself unavailable.
    balldontlie:
      api-key: ${PVPICKS_BALLDONTLIE_API_KEY:}
    # One request per league per poll: 2 a minute at the default, within the free tier's 5.
    poll-interval: ${PVPICKS_SPORTS_POLL_INTERVAL:PT60S}
    # Raw provider responses are appended here as JSON lines when set (for replay and debugging).
    recording-dir: ${PVPICKS_SPORTS_RECORDING_DIR:}
    freshness: ${PVPICKS_SPORTS_FRESHNESS:PT3M}

spring:
  flyway:
    enabled: true
  datasource:
    url: ${PVPICKS_DATASOURCE_URL}
    username: ${PVPICKS_DB_USER}
    password: ${PVPICKS_DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      data-source-properties:
        connectTimeout: 3
        socketTimeout: 5
  data:
    redis:
      host: ${PVPICKS_REDIS_HOST}
      connect-timeout: 2s
      timeout: 2s
  kafka:
    bootstrap-servers: ${PVPICKS_KAFKA_BOOTSTRAP_SERVERS}
