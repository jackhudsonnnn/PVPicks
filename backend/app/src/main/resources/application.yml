spring:
  application:
    name: p2picks
  flyway:
    enabled: false
  modulith:
    # Only packages annotated with @ApplicationModule (modules/*) are domain modules;
    # com.p2picks.app feature packages are ordinary packages.
    detection-strategy: explicitly-annotated

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
