services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: p2picks
      POSTGRES_USER: p2picks
      POSTGRES_PASSWORD: ${PVPICKS_DB_PASSWORD:?Set PVPICKS_DB_PASSWORD in infra/compose/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  kafka:
    image: apache/kafka:3.9.2
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["tools"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PVPICKS_KAFKA_UI_PORT:-8081}:8080"
  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file:
      - .env.auth
      - .env.idempotency
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_ADDRESS: 0.0.0.0
      PVPICKS_DEV_ORIGIN: ${PVPICKS_DEV_ORIGIN:-http://127.0.0.1:${PVPICKS_PORT:-8080}}
      PVPICKS_DATASOURCE_URL: jdbc:postgresql://postgres:5432/p2picks
      PVPICKS_DB_USER: p2picks
      PVPICKS_DB_PASSWORD: ${PVPICKS_DB_PASSWORD:?Set PVPICKS_DB_PASSWORD in infra/compose/.env}
      PVPICKS_REDIS_HOST: redis
      PVPICKS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PVPICKS_BET_LOCK_WORKER_ENABLED: ${PVPICKS_BET_LOCK_WORKER_ENABLED:-true}
      PVPICKS_OUTBOX_RELAY_ENABLED: ${PVPICKS_OUTBOX_RELAY_ENABLED:-true}
      PVPICKS_OUTBOX_CLEANUP_ENABLED: ${PVPICKS_OUTBOX_CLEANUP_ENABLED:-true}
      PVPICKS_OUTBOX_RETENTION: ${PVPICKS_OUTBOX_RETENTION:-P7D}
      PVPICKS_BALLDONTLIE_API_KEY: ${PVPICKS_BALLDONTLIE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PVPICKS_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  kafkadata:
